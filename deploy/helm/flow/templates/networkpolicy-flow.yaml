{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flow.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "flow.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
          protocol: TCP
    {{- if and (include "flow.coding.kubernetes" .) .Values.coding.runtimePort.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "flow.sandbox.namespace" . }}
      ports:
        - port: runtime
          protocol: TCP
    {{- end }}
{{- end }}
