{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flow.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "flow.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
          protocol: TCP
    {{- if and (include "flow.coding.kubernetes" .) .Values.coding.runtimePort.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "flow.sandbox.namespace" . }}
      ports:
        - port: runtime
          protocol: TCP
    {{- end }}
    {{- if and (include "flow.coding.opensandbox" .) .Values.coding.runtimePort.enabled .Values.coding.opensandbox.sandboxNamespace }}
    # Sandboxes in OpenSandbox's namespace call the runtime API and LLM proxy.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.coding.opensandbox.sandboxNamespace }}
        {{- if include "flow.egress.aclEnabled" . }}
        # The egress proxy's ACL helper (same namespace as Flow).
        - podSelector:
            matchLabels:
              {{- include "flow.egress.selectorLabels" . | nindent 14 }}
        {{- end }}
      ports:
        - port: runtime
          protocol: TCP
    {{- end }}
{{- end }}
