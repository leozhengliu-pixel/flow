{{- /* The YAML configuration file (docs/configuration.md, "Configuration file"), mounted at /etc/flow: config.file plus the chart's file-only values (flow.config.file). */ -}}
{{- $file := include "flow.config.file" . }}
{{- if $file }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flow.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    {{- include "flow.selectorLabels" . | nindent 4 }}
data:
  config.yaml: |
    {{- $file | nindent 4 }}
{{- end }}
