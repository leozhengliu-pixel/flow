{{- if and (include "flow.coding.kubernetes" .) .Values.sandboxes.serviceAccount.create }}
# Sandbox Pods run as this ServiceAccount. It is bound to no Role, and Flow
# sets automountServiceAccountToken: false on every sandbox Pod as well.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.sandboxes.serviceAccount.name }}
  namespace: {{ include "flow.sandbox.namespace" . }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandboxes
automountServiceAccountToken: false
{{- end }}
