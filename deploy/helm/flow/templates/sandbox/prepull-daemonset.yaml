{{- if and (include "flow.coding.kubernetes" .) .Values.sandboxes.prePull.enabled }}
{{- $pp := .Values.sandboxes.prePull }}
# Pulls the sandbox image on every sandbox node so sessions start without an
# image pull. The init containers exit immediately; the pause container keeps
# the Pod (and so the image) on the node.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "flow.fullname" . }}-prepull
  namespace: {{ include "flow.sandbox.namespace" . }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: prepull
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: flow-prepull
      app.kubernetes.io/instance: {{ .Release.Name }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flow-prepull
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: prepull
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ .Values.sandboxes.serviceAccount.name }}
      enableServiceLinks: false
      terminationGracePeriodSeconds: 1
      {{- with .Values.sandboxes.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.coding.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        {{- range $index, $image := prepend $pp.extraImages (include "flow.coding.image" $) }}
        - name: pull-{{ $index }}
          image: {{ $image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exit 0"]
          securityContext:
            {{- include "flow.restrictedContainer" $ | nindent 12 }}
          resources:
            {{- toYaml $pp.resources | nindent 12 }}
        {{- end }}
      containers:
        - name: pause
          image: {{ $pp.pauseImage | quote }}
          securityContext:
            {{- include "flow.restrictedContainer" . | nindent 12 }}
          resources:
            {{- toYaml $pp.resources | nindent 12 }}
      {{- with .Values.sandboxes.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sandboxes.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
