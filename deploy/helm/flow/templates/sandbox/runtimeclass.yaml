{{- if and (include "flow.coding.kubernetes" .) .Values.sandboxes.runtimeClass.create (include "flow.runtimeClassName" .) }}
{{- $rc := .Values.sandboxes.runtimeClass }}
# Cluster-scoped. The handler must be configured in the node's container
# runtime (containerd runtimes.<handler>), e.g. runsc for gVisor.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ include "flow.runtimeClassName" . }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandboxes
  annotations:
    helm.sh/resource-policy: keep
handler: {{ include "flow.runtimeClassHandler" . }}
{{- with $rc.overhead }}
overhead:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- if or .Values.sandboxes.nodeSelector .Values.sandboxes.tolerations }}
scheduling:
  {{- with .Values.sandboxes.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.sandboxes.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
