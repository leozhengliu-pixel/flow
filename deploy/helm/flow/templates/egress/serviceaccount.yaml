{{- if include "flow.egress.enabled" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flow.egress.fullname" . }}
  namespace: {{ include "flow.egress.namespace" . }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    {{- include "flow.egress.selectorLabels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
