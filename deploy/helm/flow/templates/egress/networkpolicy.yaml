{{- if and (include "flow.egress.enabled" .) .Values.sandboxes.networkPolicy.enabled }}
# The proxy accepts connections only from sandboxes and reaches only DNS, the
# Flow runtime port (ACL helper) and public addresses on 80/443. Squid denies
# private and metadata destinations again after DNS resolution.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flow.egress.fullname" . }}
  namespace: {{ include "flow.sandbox.namespace" . }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    {{- include "flow.egress.selectorLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "flow.egress.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              flow.dev/managed-by: flow
      ports:
        - port: proxy
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.sandboxes.networkPolicy.dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.sandboxes.networkPolicy.dns.podSelector | nindent 14 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if include "flow.egress.aclEnabled" . }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "flow.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ include "flow.runtimeContainerPort" . }}
          protocol: TCP
    {{- end }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 224.0.0.0/4
              - 240.0.0.0/4
              {{- range .Values.egressProxy.blockCIDRs }}
              {{- if not (contains ":" .) }}
              - {{ . }}
              {{- end }}
              {{- end }}
        - ipBlock:
            cidr: ::/0
            except:
              - ::1/128
              - fc00::/7
              - fe80::/10
              - ff00::/8
              {{- range .Values.egressProxy.blockCIDRs }}
              {{- if contains ":" . }}
              - {{ . }}
              {{- end }}
              {{- end }}
      ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
{{- end }}
