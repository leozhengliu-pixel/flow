{{- if and (include "flow.egress.aclEnabled" .) (not .Values.egressProxy.aclHelper.existingSecret.name) }}
# The proxy's copy of the ACL secret (Flow's copy is in the release
# namespace). Both are rendered from the same value.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flow.fullname" . }}-egress-acl
  namespace: {{ include "flow.egress.namespace" . }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    {{- include "flow.egress.selectorLabels" . | nindent 4 }}
type: Opaque
stringData:
  acl-secret: {{ include "flow.egress.aclSecretValue" . | quote }}
{{- end }}
