{{- include "flow.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flow.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    {{- include "flow.selectorLabels" . | nindent 4 }}
data:
{{- $env := include "flow.configmap.env" . }}
{{- if .Values.config.file }}
{{- /* A config.file server: setting replaces the chart's value of the same
variable (docs/configuration.md, "Helm"), so it takes effect although the
chart, like the image, sets that variable. */}}
{{- $fromFile := include "flow.config.fileEnv" (dict "root" . "env" $env) | fromJson }}
{{- range $line := splitList "\n" $env }}
{{- $name := trimSuffix ":" (trim (regexFind "^  [A-Z][A-Z0-9_]*:" $line)) }}
{{- if and $name (hasKey $fromFile $name) }}
  {{ $name }}: {{ get $fromFile $name | quote }} # config.file
{{- else if $line }}
{{ $line }}
{{- end }}
{{- end }}
{{- else }}
{{- $env }}
{{- end }}
