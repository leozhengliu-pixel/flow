{{- $v := .Values -}}
{{- $c := .Values.coding -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flow.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
    {{- include "flow.selectorLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with $v.secrets.connectorSecretKey }}
  FLOW_CONNECTOR_SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- if and $v.database.url (not $v.database.existingSecret.name) }}
  FLOW_DATABASE_URL: {{ $v.database.url | quote }}
  {{- else if $v.postgresql.enabled }}
  FLOW_DATABASE_URL: {{ printf "postgres://%s:%s@%s-postgresql:5432/%s?sslmode=disable" $v.postgresql.auth.username (include "flow.postgresql.password" .) (include "flow.fullname" .) $v.postgresql.auth.database | quote }}
  {{- else if $v.mysql.enabled }}
  FLOW_DATABASE_URL: {{ printf "%s:%s@tcp(%s-mysql:3306)/%s?parseTime=true" $v.mysql.auth.username (include "flow.mysql.password" .) (include "flow.fullname" .) $v.mysql.auth.database | quote }}
  {{- end }}
  {{- if and $v.redis.password (not $v.redis.existingSecret.name) (not $v.redisBundled.enabled) }}
  FLOW_REDIS_PASSWORD: {{ $v.redis.password | quote }}
  {{- end }}
  {{- if and (eq $v.storage.driver "s3") (not $v.storage.s3.existingSecret.name) }}
  {{- with $v.storage.s3.accessKeyId }}
  FLOW_S3_ACCESS_KEY_ID: {{ . | quote }}
  {{- end }}
  {{- with $v.storage.s3.secretAccessKey }}
  FLOW_S3_SECRET_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if $c.enabled }}
  {{- with $c.secretKey }}
  FLOW_CODING_SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- with $c.llm.anthropic.apiKey }}
  FLOW_CODING_LLM_ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with $c.llm.openai.apiKey }}
  FLOW_CODING_LLM_OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with $c.llm.opensource.apiKey }}
  FLOW_CODING_LLM_OPENSOURCE_API_KEY: {{ . | quote }}
  {{- end }}
  {{- if and (eq $c.provider "opensandbox") $c.opensandbox.apiKey (not $c.opensandbox.existingSecret.name) }}
  FLOW_CODING_OPENSANDBOX_API_KEY: {{ $c.opensandbox.apiKey | quote }}
  {{- end }}
  {{- if and (include "flow.egress.aclEnabled" .) (not $v.egressProxy.aclHelper.existingSecret.name) }}
  FLOW_CODING_EGRESS_ACL_SECRET: {{ include "flow.egress.aclSecretValue" . | quote }}
  {{- end }}
  {{- end }}
  {{- with $c.githubApp }}
  {{- with .clientSecret }}
  FLOW_GITHUB_APP_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- if and .privateKey (not .privateKeySecret.name) }}
  FLOW_GITHUB_APP_PRIVATE_KEY: {{ .privateKey | quote }}
  {{- end }}
  {{- with .webhookSecret }}
  FLOW_GITHUB_APP_WEBHOOK_SECRET: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- with $v.integrations.googleCalendar.clientSecret }}
  FLOW_GOOGLE_OAUTH_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- range $key, $value := $v.secrets.env }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
