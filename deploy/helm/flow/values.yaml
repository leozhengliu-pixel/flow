# Default values for the Flow chart. See docs/coding-sessions.md for the
# coding-sessions walkthrough and docs/configuration.md for every variable.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/leozhengliu-pixel/flow
  # Defaults to the chart appVersion.
  tag: ""
  # Pin a digest in production (sha256:...). Takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# More than one replica (or autoscaling) requires PostgreSQL or MySQL, Redis
# coordination and shared object storage (S3); the chart refuses to render
# otherwise. Flow without Redis is single-instance by design.
replicaCount: 1

# Rolling updates need multi-replica-safe storage. Empty = Recreate for a
# single replica on a ReadWriteOnce volume, RollingUpdate otherwise.
updateStrategy: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
terminationGracePeriodSeconds: 30

service:
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: flow.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: flow-tls
  #    hosts: [flow.example.com]

probes:
  startup:
    enabled: true
    # Migrations run before the listener starts; allow up to 10 minutes.
    failureThreshold: 60
    periodSeconds: 10
  readiness:
    enabled: true
    periodSeconds: 10
    failureThreshold: 3
  liveness:
    enabled: true
    periodSeconds: 20
    failureThreshold: 3

podDisruptionBudget:
  # Rendered only with more than one replica (a PDB on one replica blocks drains).
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: ""

# Optional NetworkPolicy for the Flow pods themselves: allows the HTTP port
# from anywhere (ingress controllers) and the runtime port from the sandbox
# namespace. Egress stays open (databases, code hosts, model providers).
networkPolicy:
  enabled: false

# Trusted private endpoints (docs/configuration.md "Trusted private
# endpoints"). By default Flow only connects to public HTTPS addresses for
# URLs that workspace members and admins configure (MCP connectors,
# webhooks, identity providers, self-hosted GitLab). Listing hosts here is
# an operator decision that opens those specific intranet hosts to Flow's
# server-side requests: a host is reachable only if it matches
# trustedPrivateEndpoints AND every address it resolves to is inside
# trustedPrivateNetworks. Loopback, link-local and cloud metadata addresses
# stay blocked whatever is listed. Coding-session sandboxes never get this
# access; their MCP calls go through Flow's MCP gateway.
outbound:
  # Exact hosts or "*." suffix wildcards (no bare "*"), e.g.
  #   - hsb.haier.net
  #   - "*.corp.example.com"
  trustedPrivateEndpoints: []
  # CIDRs the trusted hosts may resolve to, e.g. ["10.218.0.0/16"].
  trustedPrivateNetworks: []
  # PEM CA bundle for enterprise PKI, added to the system roots
  # (FLOW_TRUSTED_CA_FILE). Certificates are always verified. Name either a
  # Secret or a ConfigMap holding the bundle under `key`.
  trustedCA:
    secretName: ""
    configMapName: ""
    key: ca.crt

# Personal Google Calendar and Notion connections (docs/configuration.md
# "Personal Google Calendar and Notion connections"). Each row in Settings >
# Account > Connected accounts shows "Not configured" until its values are set.
# Google Calendar also needs secrets.connectorSecretKey.
integrations:
  googleCalendar:
    # Google OAuth client (type Web application). Redirect URI:
    # {config.appUrl}/api/account/connections/google-calendar/callback
    clientId: ""
    # Stored in the chart's Secret. Alternatively set FLOW_GOOGLE_OAUTH_CLIENT_SECRET
    # in secrets.existingSecret and leave this empty.
    clientSecret: ""
    # How often each connected member's calendar is read (5m to 24h).
    # Empty keeps the server default (15m).
    syncInterval: ""
  notion:
    # HTTPS address of the Notion connection page members are sent to.
    connectionUrl: ""
  # Pull-request/merge-request import for approved repositories.
  reviewImport:
    # "" keeps the server default (off) | on | off
    mode: ""
    # Go duration of at least 1m; 0 turns the import off. Empty keeps 10m.
    interval: ""
  # AI credits included with this deployment, in US dollars (Settings > AI & agents >
  # Usage shows them minus recorded coding-session and loop spend). Empty shows $0.00.
  aiCredits:
    includedUsd: ""

# Plain FLOW_* settings (see docs/configuration.md), e.g.
#   FLOW_AUTH_EMAIL_ENABLED: "true"
config:
  appUrl: "http://flow.example.com"
  logLevel: info
  logFormat: json
  env: {}

# Extra container env entries (valueFrom allowed) and envFrom sources.
extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []

secrets:
  # An existing Secret whose keys are FLOW_* variable names, loaded with
  # envFrom after the chart's own Secret (its values win). Use it for
  # FLOW_CONNECTOR_SECRET_KEY, OIDC/SAML secrets, API keys and so on.
  existingSecret: ""
  # Secret FLOW_* values the chart stores in its own Secret.
  env: {}
  # base64 32-byte AES key for connector and coding secrets
  # (openssl rand -base64 32). Required when coding sessions are enabled
  # unless coding.secretKey or an existing secret provides it.
  connectorSecretKey: ""

database:
  # sqlite | postgres | mysql. External PostgreSQL or MySQL is recommended
  # for production.
  driver: sqlite
  sqlitePath: /app/data/flow.db
  # postgres://user:pass@host:5432/flow?sslmode=require or
  # user:pass@tcp(host:3306)/flow?parseTime=true
  url: ""
  existingSecret:
    name: ""
    key: FLOW_DATABASE_URL
  maxOpenConns: ""
  maxIdleConns: ""
  connMaxLifetime: ""

redis:
  # disabled | standalone | cluster
  mode: disabled
  url: ""
  addrs: ""
  username: ""
  password: ""
  existingSecret:
    name: ""
    # Key holding FLOW_REDIS_URL or FLOW_REDIS_PASSWORD.
    key: FLOW_REDIS_PASSWORD
  tls: false
  prefix: flow

storage:
  # local | s3. local keeps uploads (and coding snapshot archives) on the
  # data volume; s3 is required for more than one replica.
  driver: local
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes: [ReadWriteOnce]
    size: 20Gi
    annotations: {}
  s3:
    bucket: ""
    region: ""
    endpoint: ""
    pathStyle: false
    prefix: uploads
    accessKeyId: ""
    secretAccessKey: ""
    existingSecret:
      name: ""
      accessKeyIdKey: FLOW_S3_ACCESS_KEY_ID
      secretAccessKeyKey: FLOW_S3_SECRET_ACCESS_KEY

# Bundled single-instance databases for evaluation only. Use managed or
# operator-run databases in production.
postgresql:
  enabled: false
  image: postgres:17-alpine
  auth:
    username: flow
    password: ""
    database: flow
  persistence:
    size: 20Gi
    storageClass: ""
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 1Gi}

mysql:
  enabled: false
  image: mysql:8.4
  auth:
    username: flow
    password: ""
    rootPassword: ""
    database: flow
  persistence:
    size: 20Gi
    storageClass: ""
  resources:
    requests: {cpu: 250m, memory: 1Gi}
    limits: {memory: 2Gi}

redisBundled:
  enabled: false
  image: redis:8.2-alpine
  persistence:
    size: 2Gi
    storageClass: ""
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}

# ---------------------------------------------------------------------------
# Coding sessions (docs/coding-sessions.md). Off by default.
# ---------------------------------------------------------------------------
coding:
  enabled: false
  # kubernetes | opensandbox | docker | fake | disabled
  provider: kubernetes
  # URL sandboxes use to reach Flow. Empty = the in-cluster Service URL
  # (the runtime port when enabled).
  runtimeUrl: ""
  # Serve the runtime API and LLM proxy on a second listener so the sandbox
  # NetworkPolicy can allow only that port (FLOW_CODING_RUNTIME_ADDR).
  runtimePort:
    enabled: false
    port: 8090
  # flow.dev/instance label used to scope orphan GC. Empty = release name.
  instanceId: ""
  # base64 32-byte AES key; empty = secrets.connectorSecretKey.
  secretKey: ""
  # Application policy ids (approved, shared MCP connectors) every
  # workspace's coding sessions may use through Flow's MCP gateway
  # (FLOW_CODING_MCP_SERVERS), besides those a workspace admin enables.
  # e.g. ["mcp-sourcebot-production"]
  mcpServers: []

  image:
    repository: ghcr.io/leozhengliu-pixel/flow-sandbox
    tag: latest
    # Pin a digest in production.
    digest: ""
    pullPolicy: IfNotPresent
    # Secret names in the sandbox namespace.
    pullSecrets: []

  branchPrefix: flow/
  prMention: "@flow"
  browser: true
  debugTerminal: true
  artifactMaxBytes: 10485760
  maxSessions: 20
  workspaceSessions: 5
  reconcileInterval: 5s
  gcInterval: 5m
  orphanGrace: 10m
  sizes:
    small: {cpu: "1", memory: 8Gi, ephemeral: 20Gi, pids: 4096}
    medium: {cpu: "2", memory: 16Gi, ephemeral: 40Gi, pids: 8192}
    large: {cpu: "4", memory: 32Gi, ephemeral: 80Gi, pids: 16384}
  workspaceSize: 20Gi
  cpuRequestRatio: "1"
  regions: []
  regionLabel: topology.kubernetes.io/region
  defaultRegion: ""
  # e.g. {small: 2, medium: 1}
  warmPool: {}
  warmPoolMaxAge: 1h
  timeouts:
    queue: 30m
    approval: 168h
    provision: 5m
    start: 10m
    setup: 20m
    turn: 1h
    heartbeat: 2m
    publish: 5m
    idle: 15m
    stopGrace: 1m
    maxSessionDuration: 4h
    debugTerminal: 20m
    tokenGrace: 5m
  retries:
    provision: 3
    start: 2
    publish: 5
    snapshot: 1
  snapshot:
    # archive (default, any CSI) | volumesnapshot (CSI snapshots + CRDs)
    strategy: archive
    volumeSnapshotClass: ""
    archivePrefix: coding-snapshots
    archiveMaxBytes: 10737418240
    timeout: 30m
    ttl: 168h
    retain: 2
    refreshInterval: 24h
  kubernetes:
    # Empty = in-cluster config (the chart's ServiceAccount).
    kubeconfig: ""
    storageClass: ""
    # auto | pvc | emptyDir
    workspaceVolume: auto
    extraLabels: {}
    extraAnnotations: {}
    qps: 20
    burst: 40
  # provider=opensandbox: sandboxes run through an OpenSandbox lifecycle
  # server in the same cluster (docs/coding-sessions-operations.md,
  # "OpenSandbox"). The chart then creates no sandbox namespace, RBAC,
  # quota or sandbox NetworkPolicies of its own.
  opensandbox:
    # The opensandbox-server chart's Service ("/v1" is appended).
    url: http://opensandbox-server.opensandbox-system.svc.cluster.local
    # Prefer existingSecret: a Secret in the release namespace holding the
    # server's API key (OpenSandbox keeps its own copy in opensandbox-system).
    apiKey: ""
    existingSecret:
      name: ""
      key: api-key
    # Optional X-EXECD-ACCESS-TOKEN, when execd requires one.
    execdTokenSecret:
      name: ""
      key: execd-token
    # Private sandbox image registry credentials (image.auth).
    imageAuth:
      username: ""
      passwordSecret:
        name: ""
        key: password
    requestTimeout: 30s
    # POST /sandboxes waits until the Pod runs (image pull included).
    createTimeout: 10m
    retries: 3
    tls:
      insecureSkipVerify: false
      # Secret with a PEM CA bundle for an https url.
      caSecret:
        name: ""
        key: ca.crt
    # Added to every sandbox's metadata (OpenSandbox applies it as labels).
    extraMetadata: {}
    # Passed through as the create request's extensions.
    extensions: {}
    # OpenSandbox Pools per size (extensions.poolRef), e.g. {small: flow-small}.
    pools: {}
    # resourceLimits per size overriding coding.sizes, e.g. {large: {cpu: "8", memory: 64Gi, gpu: "1"}}.
    sizes: {}
    # Also send ephemeral-storage limits.
    ephemeralStorage: false
    # OpenSandbox expiry kept ahead while Flow observes a sandbox.
    expiryWindow: 1h
    # proxy (through the lifecycle server) | endpoint (direct to execd)
    execdAccess: proxy
    # uid the runner, exec and the debug terminal run as (0 = execd's user).
    runAsUid: 1000
    # Where Flow writes the sandbox token inside the sandbox.
    tokenPath: /tmp/flow/token
    # "off" | "proxy": deny-by-default OpenSandbox egress policy that only
    # allows Flow and the egress proxy (needs OpenSandbox's egress sidecar).
    egressPolicy: "off"
    # Extra domains allowed by the egress policy.
    egressAllow: []
    # Namespaces of the OpenSandbox server and of the sandbox Pods it
    # creates ([kubernetes].namespace in its config.toml).
    serverNamespace: opensandbox-system
    sandboxNamespace: opensandbox
    # A NetworkPolicy in sandboxNamespace for Flow's sandbox Pods: ingress
    # from the OpenSandbox server only, egress to DNS, Flow and the egress
    # proxy. Off by default: the namespace belongs to OpenSandbox.
    networkPolicy:
      enabled: false
      podSelector:
        flow.dev/managed-by: flow
      extraIngressFrom: []
      extraEgress: []
  docker:
    host: unix:///var/run/docker.sock
    network: flow-sandbox
    runtime: ""
  egress:
    # Empty = the chart's egress proxy Service when egressProxy.enabled.
    proxyUrl: ""
    noProxy: []
  llm:
    timeout: 10m
    anthropic:
      baseUrl: https://api.anthropic.com
      apiKey: ""
    openai:
      baseUrl: https://api.openai.com/v1
      apiKey: ""
      # responses | chat (translate Responses for chat-only upstreams)
      wireApi: responses
    opensource:
      baseUrl: ""
      apiKey: ""
    models:
      claudeCode: [claude-sonnet-4-5, claude-opus-4-1]
      codex: [gpt-5-codex, gpt-5]
      openSource: []
    # USD per million tokens, e.g.
    #   claude-sonnet-4-5: {input: 3, output: 15, cacheRead: 0.3, cacheWrite: 3.75}
    prices: {}
    # Model metadata by model id (FLOW_CODING_MODEL_INFO): {label, group,
    # description, tier, contextWindow}. contextWindow (integer tokens,
    # 1024..10000000) is written as model_context_window into the Codex
    # sandbox config for that model only; leave it out for Codex's default.
    # Declare what the upstream provider/gateway actually supports, e.g.
    #   glm-5: {label: GLM-5, contextWindow: 200000}
    modelInfo: {}
  # USD per sandbox-hour by size.
  runtimePrices:
    small: "0.10"
    medium: "0.20"
    large: "0.40"
  gitlab:
    # project-token | oauth | connection
    credentialMode: project-token
    tokenScopes: [read_repository, write_repository, read_api]
  githubApp:
    appId: ""
    slug: ""
    clientId: ""
    clientSecret: ""
    # PEM. Prefer privateKeySecret so the key is mounted as a file.
    privateKey: ""
    webhookSecret: ""
    host: github.com
    apiUrl: ""
    # An existing Secret holding the PEM; mounted read-only and passed as
    # FLOW_GITHUB_APP_PRIVATE_KEY_FILE.
    privateKeySecret:
      name: ""
      key: private-key.pem
  # Extra FLOW_CODING_* overrides, rendered last into the ConfigMap.
  extraEnv: {}

# Everything Flow creates for sandboxes lives in this namespace.
sandboxes:
  namespace:
    name: flow-sandboxes
    create: true
    labels: {}
    annotations: {}
    # Pod Security admission level enforced on the namespace.
    podSecurity: restricted
    # Keep the namespace (and running sandboxes) on helm uninstall.
    keepOnUninstall: false

  rbac:
    # Role and RoleBinding for Flow in the sandbox namespace only.
    create: true
    # Read-only cluster access for preflight checks (RuntimeClass,
    # StorageClass, VolumeSnapshotClass). Without it those checks become
    # warnings.
    preflightClusterRole: true
    extraRules: []

  # ServiceAccount sandbox Pods run as. It has no RBAC and its token is never
  # mounted.
  serviceAccount:
    create: true
    name: flow-sandbox

  # Container runtime: "" or runc (default kernel), gvisor or kata. Any other
  # name refers to an existing RuntimeClass.
  runtimeClass:
    name: ""
    # Create the RuntimeClass object (cluster-scoped). Usually the node
    # provisioner (GKE Sandbox, kata-deploy) already creates it.
    create: false
    # Defaults: gvisor -> runsc, kata -> kata.
    handler: ""
    overhead: {}
    #  podFixed: {cpu: 250m, memory: 160Mi}

  # false runs sandboxes in a user namespace (hostUsers: false, Kubernetes
  # 1.33+ with a runtime that supports idmapped mounts).
  hostUsers: true

  # Dedicated, tainted node pool. Label and taint the nodes, for example:
  #   kubectl label node <n> flow.dev/pool=sandbox
  #   kubectl taint node <n> flow.dev/pool=sandbox:NoSchedule
  # Clear both for a single-node development cluster.
  nodeSelector:
    flow.dev/pool: sandbox
  tolerations:
    - key: flow.dev/pool
      operator: Equal
      value: sandbox
      effect: NoSchedule
  priorityClassName: ""

  networkPolicy:
    enabled: true
    # helm: the chart renders the sandbox policies and Flow is told not to
    # manage them. flow: Flow ensures them at startup (needs RBAC).
    manager: helm
    # Also deny all traffic for any other Pod in the namespace that no
    # policy allows.
    namespaceDefaultDeny: true
    dns:
      namespace: kube-system
      podSelector:
        k8s-app: kube-dns

  resourceQuota:
    enabled: true
    hard:
      pods: "30"
      requests.cpu: "64"
      limits.cpu: "64"
      requests.memory: 512Gi
      limits.memory: 512Gi
      requests.ephemeral-storage: 1Ti
      limits.ephemeral-storage: 1Ti
      persistentvolumeclaims: "40"
      requests.storage: 1Ti
      secrets: "200"

  limitRange:
    enabled: true
    container:
      default: {cpu: "1", memory: 2Gi, ephemeral-storage: 4Gi}
      defaultRequest: {cpu: 100m, memory: 256Mi, ephemeral-storage: 1Gi}
      max: {cpu: "8", memory: 64Gi, ephemeral-storage: 160Gi}
    persistentVolumeClaim:
      max: {storage: 200Gi}

  # Pull the sandbox image on every sandbox node ahead of time.
  prePull:
    enabled: false
    extraImages: []
    pauseImage: registry.k8s.io/pause:3.10
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 50m, memory: 64Mi}

# Squid egress proxy for sandboxes (deploy/egress-proxy). Rendered when
# coding sessions are enabled on the kubernetes provider (in the sandbox
# namespace) or the opensandbox provider (in the release namespace).
egressProxy:
  enabled: true
  image:
    repository: ghcr.io/leozhengliu-pixel/flow-egress
    # Defaults to the chart appVersion (the helper must match Flow).
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 2
  port: 3128
  # Per-environment network modes through the ACL helper. Without it every
  # sandbox gets the static allowlist.
  aclHelper:
    enabled: true
    # Shared secret between Flow and the proxy. Empty = generated once and
    # kept across upgrades (looked up from the cluster).
    secret: ""
    existingSecret:
      name: ""
      key: acl-secret
    children: 10
    timeout: 5s
  # Built-in registry and code host allowlist (files/allowlist-default.txt).
  defaultAllowlist: true
  # Extra domains for every sandbox (.example.com matches subdomains). The
  # configured GitLab and GitHub Enterprise hosts and Flow's own host are
  # added by Flow; list them here too when the ACL helper is off.
  allowlist: []
  # Extra destination CIDRs to deny (node, Pod and Service CIDRs of clusters
  # that use public address space).
  blockCIDRs: []
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# `helm test` Pod that verifies the sandbox NetworkPolicy is enforced
# (docs/coding-sessions-security.md, "Verify NetworkPolicy enforcement").
networkPolicyProbe:
  image: curlimages/curl:8.11.1
