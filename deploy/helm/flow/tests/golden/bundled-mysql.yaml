---
# Source: flow/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow
  namespace: flow
  labels:
    helm.sh/chart: flow-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: flow
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/name: flow
    app.kubernetes.io/instance: flow
    app.kubernetes.io/component: api
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: flow
      app.kubernetes.io/instance: flow
  strategy:
    # One replica on a ReadWriteOnce volume (or SQLite): the old Pod must stop
    # before the new one mounts the volume.
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flow
        app.kubernetes.io/instance: flow
        app.kubernetes.io/component: api
      annotations:
        checksum/config: d2db29ce554302b2846d373b4fbef0d8f211753637fdc04c92f61eb709cf7481
        checksum/secret: d1e4e43209659e5f96a903ab5ffe80627373972b6f9ba9cf97da66cefa5ad30d
    spec:
      serviceAccountName: flow
      # The kubernetes sandbox provider uses the in-cluster ServiceAccount token.
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flow
          image: "ghcr.io/leozhengliu-pixel/flow:0.1.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: flow
            - secretRef:
                name: flow
          env:
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
                  divisor: "1"
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          # TCP, not /api/health: a Redis outage makes health report 503 and
          # must take the Pod out of rotation, not restart it.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: flow-data
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi

---
# Source: flow/templates/bundled/mysql.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: flow-mysql
  namespace: flow
  labels:
    helm.sh/chart: flow-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: flow
    app.kubernetes.io/version: "0.1.0"
spec:
  serviceName: flow-mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flow-mysql
      app.kubernetes.io/instance: flow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flow-mysql
        app.kubernetes.io/instance: flow
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: "mysql:8.4"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: MYSQL_USER
              value: "flow"
            - name: MYSQL_DATABASE
              value: "flow"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flow-mysql
                  key: password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flow-mysql
                  key: rootPassword
          ports:
            - name: mysql
              containerPort: 3306
          readinessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 10
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
