# Source: flow/templates/sandbox/networkpolicies.yaml
# ...except DNS, the Flow runtime port and the egress proxy. Pod exec goes
# through the API server and kubelet, so no ingress rule is needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flow-sandbox-egress
  namespace: flow-sandboxes
  labels:
    helm.sh/chart: flow-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: flow
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/component: sandboxes
spec:
  podSelector:
    matchLabels:
      flow.dev/managed-by: flow
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flow
          podSelector:
            matchLabels:
              app.kubernetes.io/name: flow
              app.kubernetes.io/instance: flow
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: flow-egress
              app.kubernetes.io/instance: flow
      ports:
        - port: 3128
          protocol: TCP
