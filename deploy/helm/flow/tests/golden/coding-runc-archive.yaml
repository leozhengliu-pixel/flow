# Source: flow/templates/tests/networkpolicy-probe.yaml
# `helm test <release>` runs this Pod in the sandbox namespace with the
# sandbox label, so the sandbox NetworkPolicies apply to it. It succeeds only
# if every forbidden path is blocked and the allowed paths work. The
# flow.dev/instance value differs from Flow's, so orphan GC ignores it.
apiVersion: v1
kind: Pod
metadata:
  name: flow-netpol-probe
  namespace: flow-sandboxes
  labels:
    helm.sh/chart: flow-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: flow
    app.kubernetes.io/version: "0.1.0"
    flow.dev/managed-by: flow
    flow.dev/instance: flow-netpol-probe
    flow.dev/kind: probe
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  serviceAccountName: flow-sandbox
  activeDeadlineSeconds: 300
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  nodeSelector:
    flow.dev/pool: sandbox
  tolerations:
    - effect: NoSchedule
      key: flow.dev/pool
      operator: Equal
      value: sandbox
  containers:
    - name: probe
      image: "curlimages/curl:8.11.1"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests: {cpu: 50m, memory: 32Mi}
        limits: {cpu: 200m, memory: 64Mi}
      env:
        - name: FLOW_URL
          value: "http://flow.flow.svc.cluster.local:8080"
        - name: PROXY_URL
          value: "http://flow-egress.flow-sandboxes.svc.cluster.local:3128"
      command: ["/bin/sh", "-c"]
      args:
        - |
          fail=0
          # blocked: no connection or an HTTP error; allowed: any HTTP answer.
          blocked() { if curl -fsS -m 5 -o /dev/null "$@" 2>/dev/null; then echo "FAIL reachable: $*"; fail=1; else echo "ok blocked: $*"; fi; }
          allowed() { if curl -sS -m 10 -o /dev/null "$@"; then echo "ok reachable: $*"; else echo "FAIL unreachable: $*"; fail=1; fi; }
          # Cloud metadata, the API server, and the Internet must be unreachable directly.
          blocked --noproxy '*' http://169.254.169.254/latest/meta-data/
          blocked --noproxy '*' http://metadata.google.internal/computeMetadata/v1/
          blocked --noproxy '*' -k https://kubernetes.default.svc/version
          blocked --noproxy '*' https://example.com/
          blocked --noproxy '*' https://1.1.1.1/
          # Flow's runtime port must be reachable directly (any HTTP answer,
          # 401 included, proves the connection).
          allowed --noproxy '*' "$FLOW_URL/internal/coding-runtime/bootstrap"
          if [ -n "$PROXY_URL" ]; then
            # The proxy must refuse unauthenticated or non-allowlisted requests
            # and must not reach metadata.
            blocked --proxy "$PROXY_URL" --proxy-user probe:invalid https://github.com/
            blocked --proxy "$PROXY_URL" http://169.254.169.254/latest/meta-data/
          fi
          exit $fail

