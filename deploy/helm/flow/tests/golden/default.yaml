---
# Source: flow/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow
  namespace: flow
  labels:
    helm.sh/chart: flow-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: flow
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/name: flow
    app.kubernetes.io/instance: flow
    app.kubernetes.io/component: api
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: flow
      app.kubernetes.io/instance: flow
  strategy:
    # One replica on a ReadWriteOnce volume (or SQLite): the old Pod must stop
    # before the new one mounts the volume.
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flow
        app.kubernetes.io/instance: flow
        app.kubernetes.io/component: api
      annotations:
        checksum/config: b157bc59887ca0e0ecf2a821b4bff90625e0c78c385e3ee17ed1901b029a22e8
        checksum/secret: 8045f7c2ff8fa950c997664b41cb9b101437262f87a59a1b715715201e3b2141
    spec:
      serviceAccountName: flow
      # The kubernetes sandbox provider uses the in-cluster ServiceAccount token.
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flow
          image: "ghcr.io/leozhengliu-pixel/flow:0.1.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: flow
            - secretRef:
                name: flow
          env:
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
                  divisor: "1"
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          # TCP, not /api/health: a Redis outage makes health report 503 and
          # must take the Pod out of rotation, not restart it.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: flow-data
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
