---
# Source: flow/templates/sandbox/rbac.yaml
# Flow's permissions, limited to the sandbox namespace (design §9). Flow
# needs no ClusterRole except the optional read-only preflight role below.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flow-sandboxes
  namespace: flow-sandboxes
  labels:
    helm.sh/chart: flow-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: flow
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/component: sandboxes
# The rules match the Kubernetes provider's API calls exactly
# (api/internal/sandbox/kubernetes; preflight checks them with
# SelfSubjectAccessReview): least privilege, no watch and no event access.
rules:
  # Sandbox Pods: create, observe, adopt after a restart, delete; orphan GC lists by label.
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, delete]
  # Runner logs archived on stop.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # Debug terminal (Provider.Exec): create for SPDY, get for the WebSocket
  # exec protocol (Kubernetes >= 1.30).
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
  # Per-sandbox token Secrets (created, owner-referenced to the Pod by patch,
  # deleted on stop); list for orphan GC by label.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, list, delete, patch]
  # Workspace volumes (volumesnapshot strategy or FLOW_CODING_K8S_WORKSPACE_VOLUME=pvc).
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, get, list, delete]
  # Preflight reads the sandbox namespace's Pod Security label (a namespace
  # get is authorized in that namespace, so the Role can grant it).
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: ["flow-sandboxes"]
    verbs: [get]
