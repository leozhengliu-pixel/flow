# Source: flow/templates/networkpolicy-flow.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flow
  namespace: flow
  labels:
    helm.sh/chart: flow-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: flow
    app.kubernetes.io/version: "0.1.0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flow
      app.kubernetes.io/instance: flow
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
          protocol: TCP
    # Sandboxes in OpenSandbox's namespace call the runtime API and LLM proxy.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opensandbox
        # The egress proxy's ACL helper (same namespace as Flow).
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: flow-egress
              app.kubernetes.io/instance: flow
      ports:
        - port: runtime
          protocol: TCP

