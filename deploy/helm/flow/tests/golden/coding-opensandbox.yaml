# Source: flow/templates/egress/networkpolicy.yaml
# The proxy accepts connections only from sandboxes and reaches only DNS, the
# Flow runtime port (ACL helper) and public addresses on 80/443. Squid denies
# private and metadata destinations again after DNS resolution.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flow-egress
  namespace: flow
  labels:
    helm.sh/chart: flow-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: flow
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/name: flow-egress
    app.kubernetes.io/instance: flow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flow-egress
      app.kubernetes.io/instance: flow
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        # Flow's sandbox Pods in OpenSandbox's sandbox namespace.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opensandbox
          podSelector:
            matchLabels:
              flow.dev/managed-by: flow
      ports:
        - port: proxy
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flow
          podSelector:
            matchLabels:
              app.kubernetes.io/name: flow
              app.kubernetes.io/instance: flow
      ports:
        - port: 8090
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 224.0.0.0/4
              - 240.0.0.0/4
        - ipBlock:
            cidr: ::/0
            except:
              - ::1/128
              - fc00::/7
              - fe80::/10
              - ff00::/8
      ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP

