spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: flow-egress
      app.kubernetes.io/instance: flow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flow-egress
        app.kubernetes.io/instance: flow
        app.kubernetes.io/component: egress-proxy
      annotations:
        checksum/config: 71935b95fbc43aa4e3201e4468041eed854fe5ec9c68e76b0f779e8840f39253
    spec:
      serviceAccountName: flow-egress
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: squid
          image: "ghcr.io/leozhengliu-pixel/flow-egress:0.1.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: proxy
              containerPort: 3128
              protocol: TCP
          env:
            - name: FLOW_EGRESS_PORT
              value: "3128"
            - name: FLOW_EGRESS_RUNTIME_DIR
              value: /tmp/flow-egress
            - name: FLOW_EGRESS_ALLOWLIST_FILE
              value: /etc/flow-egress/lists/allowlist.txt
            - name: FLOW_EGRESS_DEFAULT_ALLOWLIST_FILE
              value: /etc/flow-egress/lists/allowlist-default.txt
            - name: FLOW_CODING_EGRESS_DEFAULT_ALLOWLIST
              value: "on"
            - name: FLOW_EGRESS_HELPER_CHILDREN
              value: "10"
            - name: FLOW_EGRESS_BLOCK_CIDRS
              value: ""
            - name: FLOW_EGRESS_FLOW_URL
              value: "http://flow.flow.svc.cluster.local:8090"
            - name: FLOW_EGRESS_ACL_TIMEOUT
              value: "5s"
            - name: FLOW_CODING_EGRESS_ACL_SECRET_FILE
              value: /var/run/flow-egress/acl-secret
          readinessProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 20
            failureThreshold: 3
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: allowlists
              mountPath: /etc/flow-egress/lists
              readOnly: true
            - name: acl-secret
              mountPath: /var/run/flow-egress
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: allowlists
          configMap:
            name: flow-egress
        - name: acl-secret
          secret:
            secretName: flow-egress-acl
            defaultMode: 0400
            items:
              - key: acl-secret
                path: acl-secret
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: flow-egress
                    app.kubernetes.io/instance: flow
