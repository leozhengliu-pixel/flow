# Source: flow/templates/opensandbox/networkpolicy.yaml
# Flow's sandbox Pods in OpenSandbox's sandbox namespace (selected by the
# flow.dev/* metadata OpenSandbox applies as Pod labels): ingress only from
# the OpenSandbox server (execd 44772 and the egress sidecar 18080 through its
# proxy), egress only to DNS, Flow's runtime port and the egress proxy.
# Rendered into a namespace this chart does not own; verify on the real
# cluster that OpenSandbox copies metadata onto Pod labels.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flow-opensandbox-sandboxes
  namespace: opensandbox
  labels:
    helm.sh/chart: flow-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: flow
    app.kubernetes.io/version: "0.1.0"
spec:
  podSelector:
    matchLabels:
      flow.dev/managed-by: flow
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opensandbox-system
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flow
          podSelector:
            matchLabels:
              app.kubernetes.io/name: flow
              app.kubernetes.io/instance: flow
      ports:
        - port: 8090
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flow
          podSelector:
            matchLabels:
              app.kubernetes.io/name: flow-egress
              app.kubernetes.io/instance: flow
      ports:
        - port: 3128
          protocol: TCP

