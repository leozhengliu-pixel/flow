---
# Source: flow/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow
  namespace: flow
  labels:
    helm.sh/chart: flow-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: flow
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/name: flow
    app.kubernetes.io/instance: flow
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: flow
      app.kubernetes.io/instance: flow
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flow
        app.kubernetes.io/instance: flow
        app.kubernetes.io/component: api
      annotations:
        checksum/config: 1082590c4a003a8894cdd26c7004624211be2948dbc789601c254251caeb0424
        checksum/secret: 55b57d949fb7e4ce1572edb5c2363a2db1f4784cb97506773ec43608ffdc324a
    spec:
      serviceAccountName: flow
      # The kubernetes sandbox provider uses the in-cluster ServiceAccount token.
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flow
          image: "ghcr.io/leozhengliu-pixel/flow:0.1.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: flow
            - secretRef:
                name: flow
          env:
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
                  divisor: "1"
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          # TCP, not /api/health: a Redis outage makes health report 503 and
          # must take the Pod out of rotation, not restart it.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi

---
# Source: flow/templates/bundled/postgresql.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: flow-postgresql
  namespace: flow
  labels:
    helm.sh/chart: flow-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: flow
    app.kubernetes.io/version: "0.1.0"
spec:
  serviceName: flow-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flow-postgresql
      app.kubernetes.io/instance: flow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flow-postgresql
        app.kubernetes.io/instance: flow
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: "postgres:17-alpine"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: POSTGRES_USER
              value: "flow"
            - name: POSTGRES_DB
              value: "flow"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flow-postgresql
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "flow", "-d", "flow"]
            periodSeconds: 10
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi

---
# Source: flow/templates/bundled/redis.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: flow-redis
  namespace: flow
  labels:
    helm.sh/chart: flow-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: flow
    app.kubernetes.io/version: "0.1.0"
spec:
  serviceName: flow-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flow-redis
      app.kubernetes.io/instance: flow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flow-redis
        app.kubernetes.io/instance: flow
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: "redis:8.2-alpine"
          args: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
