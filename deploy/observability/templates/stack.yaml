{{- range $name, $component := .Values.components }}
{{- $id := printf "%s-%s" $.Release.Name $name }}
{{- $files := dict }}
{{- range $key, $file := $component.config }}
  {{- $_ := set $files $key ($.Files.Get $file.source) }}
{{- end }}
{{- if $component.config }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $id }}
data:
  {{- range $key, $contents := $files }}
  {{ $key }}: |
    {{- $contents | nindent 4 }}
  {{- end }}
{{- end }}
{{- if $component.storage }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $id }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with $.Values.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $component.storage }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  ports:
    - name: http
      port: {{ $component.port }}
    {{- with $component.ingestPort }}
    - name: otlp
      port: {{ . }}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $id }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
      {{- if $component.config }}
      annotations:
        checksum/config: {{ $files | toJson | sha256sum }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with $component.fsGroup }}
      securityContext:
        fsGroup: {{ . }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ $component.image }}
          {{- with $component.args }}
          args: {{ . | toJson }}
          {{- end }}
          resources:
            limits:
              cpu: {{ $component.cpu }}
              memory: {{ $component.memory }}
          {{- if eq $name "grafana" }}
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "grafanaSecret names a Secret with an admin-password key" $.Values.grafanaSecret }}
                  key: admin-password
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
          {{- end }}
          volumeMounts:
            {{- if $component.storage }}
            - name: data
              mountPath: {{ $component.dataPath }}
            {{- end }}
            {{- range $key, $file := $component.config }}
            - name: config
              mountPath: {{ $file.target }}
              subPath: {{ $key }}
              readOnly: true
            {{- end }}
      volumes:
        {{- if $component.storage }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $id }}
        {{- end }}
        {{- if $component.config }}
        - name: config
          configMap:
            name: {{ $id }}
        {{- end }}
{{- end }}
