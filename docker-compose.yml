services:
  app:
    build:
      context: .
    environment:
      FLOW_LOG_LEVEL: ${FLOW_LOG_LEVEL:-info}
      FLOW_LOG_FORMAT: ${FLOW_LOG_FORMAT:-text}
      FLOW_DATABASE_DRIVER: ${FLOW_DATABASE_DRIVER:-sqlite}
      FLOW_DATABASE_URL: ${FLOW_DATABASE_URL:-}
      FLOW_DATABASE_PATH: ${FLOW_DATABASE_PATH:-/app/data/flow.db}
      FLOW_DATABASE_MAX_OPEN_CONNS: ${FLOW_DATABASE_MAX_OPEN_CONNS:-0}
      FLOW_DATABASE_MAX_IDLE_CONNS: ${FLOW_DATABASE_MAX_IDLE_CONNS:-0}
      FLOW_DATABASE_CONN_MAX_LIFETIME: ${FLOW_DATABASE_CONN_MAX_LIFETIME:-30m}
      FLOW_WORKSPACE_STATE_MAX_BYTES: ${FLOW_WORKSPACE_STATE_MAX_BYTES:-67108864}
      FLOW_REDIS_MODE: ${FLOW_REDIS_MODE:-disabled}
      FLOW_REDIS_URL: ${FLOW_REDIS_URL:-}
      FLOW_REDIS_ADDRS: ${FLOW_REDIS_ADDRS:-}
      FLOW_REDIS_USERNAME: ${FLOW_REDIS_USERNAME:-}
      FLOW_REDIS_PASSWORD: ${FLOW_REDIS_PASSWORD:-}
      FLOW_REDIS_DB: ${FLOW_REDIS_DB:-0}
      FLOW_REDIS_TLS: ${FLOW_REDIS_TLS:-false}
      FLOW_REDIS_PREFIX: ${FLOW_REDIS_PREFIX:-flow}
      FLOW_REDIS_POOL_SIZE: ${FLOW_REDIS_POOL_SIZE:-40}
      FLOW_REDIS_MIN_IDLE_CONNS: ${FLOW_REDIS_MIN_IDLE_CONNS:-5}
      FLOW_REDIS_DIAL_TIMEOUT: ${FLOW_REDIS_DIAL_TIMEOUT:-5s}
      FLOW_REDIS_READ_TIMEOUT: ${FLOW_REDIS_READ_TIMEOUT:-3s}
      FLOW_REDIS_WRITE_TIMEOUT: ${FLOW_REDIS_WRITE_TIMEOUT:-3s}
      FLOW_REDIS_CONNECT_TIMEOUT: ${FLOW_REDIS_CONNECT_TIMEOUT:-15s}
      FLOW_REDIS_LOCK_TTL: ${FLOW_REDIS_LOCK_TTL:-30s}
      FLOW_REDIS_LOCK_WAIT: ${FLOW_REDIS_LOCK_WAIT:-5s}
      FLOW_STORAGE_DRIVER: ${FLOW_STORAGE_DRIVER:-local}
      FLOW_STORAGE_LOCAL_PATH: ${FLOW_STORAGE_LOCAL_PATH:-/app/data/uploads}
      FLOW_S3_BUCKET: ${FLOW_S3_BUCKET:-}
      FLOW_S3_REGION: ${FLOW_S3_REGION:-}
      FLOW_S3_ENDPOINT: ${FLOW_S3_ENDPOINT:-}
      FLOW_S3_ACCESS_KEY_ID: ${FLOW_S3_ACCESS_KEY_ID:-}
      FLOW_S3_SECRET_ACCESS_KEY: ${FLOW_S3_SECRET_ACCESS_KEY:-}
      FLOW_S3_SESSION_TOKEN: ${FLOW_S3_SESSION_TOKEN:-}
      FLOW_S3_PATH_STYLE: ${FLOW_S3_PATH_STYLE:-false}
      FLOW_S3_PREFIX: ${FLOW_S3_PREFIX:-uploads}
      FLOW_S3_VALIDATE_ON_START: ${FLOW_S3_VALIDATE_ON_START:-true}
      FLOW_APP_URL: ${FLOW_APP_URL:-http://127.0.0.1:5173}
      FLOW_WORKSPACE_REGION_SELECTOR_ENABLED: ${FLOW_WORKSPACE_REGION_SELECTOR_ENABLED:-true}
      FLOW_WORKSPACE_DEFAULT_REGION: ${FLOW_WORKSPACE_DEFAULT_REGION:-us}
      FLOW_STATIC_PATH: /app/web
      FLOW_AUTH_EMAIL_ENABLED: ${FLOW_AUTH_EMAIL_ENABLED:-true}
      FLOW_DEV_AUTH_TOKENS: ${FLOW_DEV_AUTH_TOKENS:-false}
      FLOW_AUTH_AUTO_PROVISION: ${FLOW_AUTH_AUTO_PROVISION:-true}
      FLOW_AUTH_ALLOWED_DOMAINS: ${FLOW_AUTH_ALLOWED_DOMAINS:-}
      FLOW_AUTH_GOOGLE_ENABLED: ${FLOW_AUTH_GOOGLE_ENABLED:-false}
      FLOW_GOOGLE_CLIENT_ID: ${FLOW_GOOGLE_CLIENT_ID:-}
      FLOW_GOOGLE_CLIENT_SECRET: ${FLOW_GOOGLE_CLIENT_SECRET:-}
      FLOW_GOOGLE_REDIRECT_URL: ${FLOW_GOOGLE_REDIRECT_URL:-}
      FLOW_AUTH_OIDC_ENABLED: ${FLOW_AUTH_OIDC_ENABLED:-false}
      FLOW_OIDC_ISSUER_URL: ${FLOW_OIDC_ISSUER_URL:-}
      FLOW_OIDC_CLIENT_ID: ${FLOW_OIDC_CLIENT_ID:-}
      FLOW_OIDC_CLIENT_SECRET: ${FLOW_OIDC_CLIENT_SECRET:-}
      FLOW_OIDC_SCOPES: ${FLOW_OIDC_SCOPES:-openid profile email}
      FLOW_OIDC_DISPLAY_NAME: ${FLOW_OIDC_DISPLAY_NAME:-OpenID Connect}
      FLOW_OIDC_IDENTITY_CLAIM: ${FLOW_OIDC_IDENTITY_CLAIM:-sub}
      FLOW_AUTH_SAML_ENABLED: ${FLOW_AUTH_SAML_ENABLED:-false}
      FLOW_SAML_METADATA_URL: ${FLOW_SAML_METADATA_URL:-}
      FLOW_SAML_METADATA_XML: ${FLOW_SAML_METADATA_XML:-}
      FLOW_SAML_ENTITY_ID: ${FLOW_SAML_ENTITY_ID:-}
      FLOW_SAML_ACS_URL: ${FLOW_SAML_ACS_URL:-}
      FLOW_SAML_SP_PRIVATE_KEY: ${FLOW_SAML_SP_PRIVATE_KEY:-}
      FLOW_SAML_SP_CERTIFICATE: ${FLOW_SAML_SP_CERTIFICATE:-}
      FLOW_SAML_DISPLAY_NAME: ${FLOW_SAML_DISPLAY_NAME:-SAML}
      FLOW_AGENT_ENABLED: ${FLOW_AGENT_ENABLED:-false}
      FLOW_AGENT_BASE_URL: ${FLOW_AGENT_BASE_URL:-https://api.openai.com/v1}
      FLOW_AGENT_API_KEY: ${FLOW_AGENT_API_KEY:-}
      FLOW_AGENT_MODEL: ${FLOW_AGENT_MODEL:-gpt-5-mini}
      FLOW_AGENT_TIMEOUT: ${FLOW_AGENT_TIMEOUT:-60s}
      FLOW_TELEMETRY_ENABLED: ${FLOW_TELEMETRY_ENABLED:-false}
      FLOW_ENVIRONMENT: ${FLOW_ENVIRONMENT:-production}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-flow-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
    ports:
      - "5173:8080"
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/flow-api", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    volumes:
      - flow-api-data:/app/data
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flow}
      POSTGRES_DB: ${POSTGRES_DB:-flow}
    ports:
      - "5432:5432"
    volumes:
      - flow-postgres-data:/var/lib/postgresql/data

  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    environment:
      MYSQL_USER: ${MYSQL_USER:-flow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-flow}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flow}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
    ports:
      - "3306:3306"
    volumes:
      - flow-mysql-data:/var/lib/mysql

  redis:
    image: redis:8.2-alpine
    profiles: ["redis"]
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "6379:6379"
    volumes:
      - flow-redis-data:/data

  redis-cluster-1:
    image: redis:8.2-alpine
    profiles: ["redis-cluster"]
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--protected-mode", "no", "--bind", "0.0.0.0"]
    volumes:
      - flow-redis-cluster-1:/data

  redis-cluster-2:
    image: redis:8.2-alpine
    profiles: ["redis-cluster"]
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--protected-mode", "no", "--bind", "0.0.0.0"]
    volumes:
      - flow-redis-cluster-2:/data

  redis-cluster-3:
    image: redis:8.2-alpine
    profiles: ["redis-cluster"]
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--protected-mode", "no", "--bind", "0.0.0.0"]
    volumes:
      - flow-redis-cluster-3:/data

  redis-cluster-init:
    image: redis:8.2-alpine
    profiles: ["redis-cluster"]
    depends_on:
      - redis-cluster-1
      - redis-cluster-2
      - redis-cluster-3
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until redis-cli -h redis-cluster-1 ping && redis-cli -h redis-cluster-2 ping && redis-cli -h redis-cluster-3 ping; do sleep 1; done;
        redis-cli --cluster create redis-cluster-1:6379 redis-cluster-2:6379 redis-cluster-3:6379 --cluster-replicas 0 --cluster-yes || true

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${FLOW_S3_ACCESS_KEY_ID:-flow}
      MINIO_ROOT_PASSWORD: ${FLOW_S3_SECRET_ACCESS_KEY:-flow-development-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - flow-s3-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    profiles: ["s3"]
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set flow http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done;
        mc mb --ignore-existing flow/${FLOW_S3_BUCKET:-flow-uploads}
    environment:
      MINIO_ROOT_USER: ${FLOW_S3_ACCESS_KEY_ID:-flow}
      MINIO_ROOT_PASSWORD: ${FLOW_S3_SECRET_ACCESS_KEY:-flow-development-secret}

volumes:
  flow-api-data:
  flow-postgres-data:
  flow-mysql-data:
  flow-redis-data:
  flow-redis-cluster-1:
  flow-redis-cluster-2:
  flow-redis-cluster-3:
  flow-s3-data:
