services:
  app:
    build:
      context: .
    environment:
      FLOW_DB_PATH: /app/data/flow.db
      FLOW_UPLOAD_PATH: /app/data/uploads
      FLOW_APP_URL: http://127.0.0.1:5173
      FLOW_STATIC_PATH: /app/web
      FLOW_SEED_PROFILE: zentao-demo
    ports:
      - "5173:8080"
      - "8080:8080"
    volumes:
      - flow-api-data:/app/data

volumes:
  flow-api-data:
