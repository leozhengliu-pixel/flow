# Secret scanning config for gitleaks (picked up by gitleaks-action in
# .github/workflows/security.yml). Keep the default rule set; only exclude
# fixtures that are fake by construction.

[extend]
useDefault = true

[allowlist]
description = "Synthetic test fixtures (Helm chart scenarios, scale differential tests)"
# Scenarios use a fake coding secret key (base64 of "test-key-test-key-...")
# and the goldens are their rendered output, including checksum/secret
# annotations. Nothing in these directories is a real credential.
paths = [
  '''^deploy/helm/flow/tests/(scenarios|golden)/[^/]+\.yaml$''',
  # Synthetic fixtures of the scale differential tests (fake OAuth client
  # secrets and API keys, fixed workspace IDs) and inventory prose that the
  # generic-api-key rule mistakes for keys. Listed by name, not by pattern.
  '''^api/cmd/server/oauth_cold_test\.go$''',
  '''^api/cmd/server/api_keys_cold_test\.go$''',
  '''^api/internal/store/legacy_discussion_inputs_test\.go$''',
  '''^api/internal/store/metadata_inventory/server/agent_runtime_connectors\.json$''',
  '''^api/internal/store/metadata_inventory/server/code_webhooks\.json$''',
]
# The same fake key, reused by the sandbox envtest RBAC test.
regexes = [
  '''dGVzdC1rZXktdGVzdC1rZXktdGVzdC1rZXktdGVzdC0=''',
  # A fixed local-store mutation ID (a UUID) in local_store_issue_writes_test.go.
  '''667e3c46-1d81-4fc8-a556-776cdb6a906b''',
]
