name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  web:
    name: Web (Node 24 LTS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Use project npm version
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests and coverage
        run: npm run test:coverage

      - name: Workflow coverage gate
        run: npm run test:coverage:workflows

      - name: Record whole-source coverage baseline
        run: npm run test:coverage:all

      - name: Verify API route inventory
        working-directory: ${{ github.workspace }}
        run: node scripts/generate-openapi.mjs --check

      - name: Build
        run: npm run build

  web-node-26:
    name: Web (Node 26 compatibility)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Use project npm version
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify generated code matches docs/openapi.json
        working-directory: ${{ github.workspace }}
        run: node sdk/typescript/scripts/generate.mjs --check

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Use project npm version
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: web
        run: npm run test:e2e

  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test with race detector and coverage
        # cmd/server and internal/store each take about 15 minutes under the race
        # detector; the per-package timeout leaves room for growth.
        run: go test -race -timeout 45m -covermode=atomic -coverprofile=coverage.out ./...

      - name: Enforce coverage floor
        run: ../scripts/check-go-coverage.sh coverage.out

  infrastructure:
    name: Infrastructure integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flow
          POSTGRES_PASSWORD: flow
          POSTGRES_DB: flow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flow -d flow"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: flow
          MYSQL_PASSWORD: flow
          MYSQL_DATABASE: flow
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:8.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: PostgreSQL round trip
        working-directory: api
        env:
          FLOW_TEST_DATABASE_DRIVER: postgres
          FLOW_TEST_DATABASE_URL: postgres://flow:flow@127.0.0.1:5432/flow?sslmode=disable
        run: go test -tags=integration ./internal/store -run 'TestExternalDatabase(WorkspaceRoundTrip|ApplicationSchema)' -count=1

      - name: MySQL round trip
        working-directory: api
        env:
          FLOW_TEST_DATABASE_DRIVER: mysql
          FLOW_TEST_DATABASE_URL: mysql://flow:flow@127.0.0.1:3306/flow
        run: go test -tags=integration ./internal/store -run 'TestExternalDatabase(WorkspaceRoundTrip|ApplicationSchema)' -count=1

      - name: Redis coordination round trip
        working-directory: api
        env:
          FLOW_TEST_REDIS_ADDR: 127.0.0.1:6379
        run: go test -tags=integration ./internal/coordination -run TestExternalRedisCoordinationRoundTrip

      - name: Create isolated binlog regression database
        run: >-
          docker exec -e MYSQL_PWD=root ${{ job.services.mysql.id }} mysql -uroot -e
          "CREATE DATABASE flow_write_audit; GRANT ALL ON flow_write_audit.* TO 'flow'@'%'; GRANT REPLICATION CLIENT ON *.* TO 'flow'@'%';"

      - name: Verify bounded MySQL import writes
        working-directory: api
        env:
          FLOW_TEST_WRITE_MYSQL_DSN: flow:flow@tcp(127.0.0.1:3306)/flow_write_audit?parseTime=true
          FLOW_ASSERT_WRITE_BOUNDS: '1'
        run: go test ./cmd/server -run '^TestMySQLImportWriteAmplification$' -count=1 -v

      - name: Start S3 server
        # MinIO no longer publishes pullable images (quay.io and Docker Hub answer
        # 401). The round trip only needs HeadBucket and object put/get/delete, which
        # S3Mock serves; it creates the bucket at startup and accepts any credentials.
        run: |
          docker run -d --name flow-s3 -p 9000:9090 \
            -e COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=flow-integration \
            adobe/s3mock:5.2.3
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:9000/flow-integration; then exit 0; fi
            sleep 2
          done
          docker logs flow-s3
          exit 1

      - name: S3 round trip
        working-directory: api
        env:
          FLOW_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          FLOW_TEST_S3_BUCKET: flow-integration
          FLOW_TEST_S3_ACCESS_KEY: flow
          FLOW_TEST_S3_SECRET_KEY: flow-development-secret
        run: go test -tags=integration ./internal/objectstore -run TestExternalS3RoundTrip

  # coding sessions (track C): the in-sandbox runner and the sandbox image files.
  sandbox-runner:
    name: Sandbox runner
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandbox-runner
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: sandbox-runner/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit and recorded-fixture tests
        run: npm test

      - name: Build bundle
        run: npm run build

      - name: Lint sandbox image
        working-directory: ${{ github.workspace }}
        run: |
          docker run --rm -i hadolint/hadolint:v2.12.0 < deploy/sandbox-image/Dockerfile
          shellcheck deploy/sandbox-image/bin/* deploy/sandbox-image/*.sh

  # coding sessions (track H): Helm chart lint/template golden tests and the
  # egress proxy entrypoint test. Offline only (KUBECONFIG=/dev/null).
  helm-chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.0

      - name: Chart tests
        env:
          KUBECONFIG: /dev/null
        run: sh deploy/helm/flow/tests/run.sh

      - name: Lint egress proxy image
        run: |
          docker run --rm -i hadolint/hadolint:v2.12.0 < deploy/egress-proxy/Dockerfile
          shellcheck deploy/egress-proxy/entrypoint.sh
