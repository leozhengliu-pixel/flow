name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # The three vitest coverage gates run the same suite against different coverage
  # scopes and thresholds, so they run side by side instead of one after another.
  # "Web (Node 24 LTS)" below is the required status check that gathers them.
  web-checks:
    name: Web lint, route inventory and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Use project npm version
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify API route inventory
        working-directory: ${{ github.workspace }}
        run: node scripts/generate-openapi.mjs --check

      - name: Build
        run: npm run build

  web-tests:
    name: Web unit tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: critical coverage
            script: test:coverage
          - name: workflow coverage gate
            script: test:coverage:workflows
          - name: whole-source coverage baseline
            script: test:coverage:all
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Use project npm version
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Unit tests and coverage
        run: npm run ${{ matrix.script }}

  web:
    name: Web (Node 24 LTS)
    needs: [web-checks, web-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every web job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "A web job did not succeed." >&2
              exit 1
            fi
          done

  web-node-26:
    name: Web (Node 26 compatibility)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Use project npm version
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify generated code matches docs/openapi.json
        working-directory: ${{ github.workspace }}
        run: node sdk/typescript/scripts/generate.mjs --check

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Use project npm version
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: web
        run: npm run test:e2e

  # The API suite is split so no single runner carries it all: cmd/server (about
  # 55 minutes under the race detector) and internal/store (about 17 minutes) are
  # sharded by test name, and every other package runs in one job. Each job writes
  # its own coverage profile; api-coverage merges them and enforces the floor.
  # "API" below is the required status check that gathers everything.
  api-static:
    name: API vet and shard check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    env:
      GO_TEST_LIST_FLAGS: -race -covermode=atomic
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Vet
        run: go vet ./...

      # Fails unless the shards of each sharded package partition its tests: every
      # test lands in exactly one shard, and each shard's -run pattern selects
      # exactly that shard's tests. The shard counts must match the api-test matrix.
      - name: Check test shards cover every test once (cmd/server)
        env:
          CHECK_PATTERNS: '1'
        run: ../scripts/ci/go-test-shard.sh check ./cmd/server 8

      - name: Check test shards cover every test once (internal/store)
        env:
          CHECK_PATTERNS: '1'
        run: ../scripts/ci/go-test-shard.sh check ./internal/store 3

  api-test:
    name: API tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: api
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'server 1/8', profile: server-1, package: ./cmd/server, shard: 1, shards: 8 }
          - { name: 'server 2/8', profile: server-2, package: ./cmd/server, shard: 2, shards: 8 }
          - { name: 'server 3/8', profile: server-3, package: ./cmd/server, shard: 3, shards: 8 }
          - { name: 'server 4/8', profile: server-4, package: ./cmd/server, shard: 4, shards: 8 }
          - { name: 'server 5/8', profile: server-5, package: ./cmd/server, shard: 5, shards: 8 }
          - { name: 'server 6/8', profile: server-6, package: ./cmd/server, shard: 6, shards: 8 }
          - { name: 'server 7/8', profile: server-7, package: ./cmd/server, shard: 7, shards: 8 }
          - { name: 'server 8/8', profile: server-8, package: ./cmd/server, shard: 8, shards: 8 }
          - { name: 'store 1/3', profile: store-1, package: ./internal/store, shard: 1, shards: 3 }
          - { name: 'store 2/3', profile: store-2, package: ./internal/store, shard: 2, shards: 3 }
          - { name: 'store 3/3', profile: store-3, package: ./internal/store, shard: 3, shards: 3 }
          - { name: 'other packages', profile: other, package: others, shard: 0, shards: 0 }
    env:
      # Same flags as the test run, so the instrumented test binary is built once
      # and the list step is served from the build cache.
      GO_TEST_LIST_FLAGS: -race -covermode=atomic
      PACKAGE: ${{ matrix.package }}
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ matrix.shards }}
      PROFILE: ${{ matrix.profile }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Test with race detector and coverage
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/coverage"
          if [ "$PACKAGE" = others ]; then
            # Everything the sharded jobs do not cover.
            mapfile -t packages < <(go list ./... | grep -vE '/cmd/server$|/internal/store$')
            selection=()
          else
            packages=("$PACKAGE")
            pattern=$(../scripts/ci/go-test-shard.sh run "$PACKAGE" "$SHARD" "$SHARDS")
            echo "Shard $SHARD/$SHARDS of $PACKAGE: $(( $(printf '%s' "$pattern" | tr -cd '|' | wc -c) + 1 )) tests"
            selection=(-run "$pattern")
          fi
          go test -race -timeout 30m -covermode=atomic \
            -coverprofile="$GITHUB_WORKSPACE/coverage/$PROFILE.out" \
            "${selection[@]}" "${packages[@]}"

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage-${{ matrix.profile }}
          path: coverage/${{ matrix.profile }}.out
          if-no-files-found: error
          retention-days: 3

  api-coverage:
    name: API coverage
    needs: [api-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Download coverage profiles
        uses: actions/download-artifact@v8
        with:
          pattern: go-coverage-*
          path: ${{ github.workspace }}/coverage
          merge-multiple: true

      - name: Merge coverage profiles
        run: ../scripts/ci/merge-go-coverage.sh coverage.out "$GITHUB_WORKSPACE"/coverage/*.out

      - name: Enforce coverage floor
        run: |
          set -euo pipefail
          ../scripts/check-go-coverage.sh coverage.out | tee coverage-summary.txt
          {
            echo '### Go coverage'
            echo '```'
            cat coverage-summary.txt
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  api:
    name: API
    needs: [api-static, api-test, api-coverage]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every API job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "An API job did not succeed." >&2
              exit 1
            fi
          done

  infrastructure:
    name: Infrastructure integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flow
          POSTGRES_PASSWORD: flow
          POSTGRES_DB: flow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flow -d flow"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: flow
          MYSQL_PASSWORD: flow
          MYSQL_DATABASE: flow
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:8.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: PostgreSQL round trip
        working-directory: api
        env:
          FLOW_TEST_DATABASE_DRIVER: postgres
          FLOW_TEST_DATABASE_URL: postgres://flow:flow@127.0.0.1:5432/flow?sslmode=disable
        run: go test -tags=integration ./internal/store -run 'TestExternalDatabase(WorkspaceRoundTrip|ApplicationSchema)' -count=1

      - name: MySQL round trip
        working-directory: api
        env:
          FLOW_TEST_DATABASE_DRIVER: mysql
          FLOW_TEST_DATABASE_URL: mysql://flow:flow@127.0.0.1:3306/flow
        run: go test -tags=integration ./internal/store -run 'TestExternalDatabase(WorkspaceRoundTrip|ApplicationSchema)' -count=1

      - name: Redis coordination round trip
        working-directory: api
        env:
          FLOW_TEST_REDIS_ADDR: 127.0.0.1:6379
        run: go test -tags=integration ./internal/coordination -run TestExternalRedisCoordinationRoundTrip

      - name: Create isolated binlog regression database
        run: >-
          docker exec -e MYSQL_PWD=root ${{ job.services.mysql.id }} mysql -uroot -e
          "CREATE DATABASE flow_write_audit; GRANT ALL ON flow_write_audit.* TO 'flow'@'%'; GRANT REPLICATION CLIENT ON *.* TO 'flow'@'%';"

      - name: Verify bounded MySQL import writes
        working-directory: api
        env:
          FLOW_TEST_WRITE_MYSQL_DSN: flow:flow@tcp(127.0.0.1:3306)/flow_write_audit?parseTime=true
          FLOW_ASSERT_WRITE_BOUNDS: '1'
        run: go test ./cmd/server -run '^TestMySQLImportWriteAmplification$' -count=1 -v

      - name: Start S3 server
        # MinIO no longer publishes pullable images (quay.io and Docker Hub answer
        # 401). The round trip only needs HeadBucket and object put/get/delete, which
        # S3Mock serves; it creates the bucket at startup and accepts any credentials.
        run: |
          docker run -d --name flow-s3 -p 9000:9090 \
            -e COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=flow-integration \
            adobe/s3mock:5.2.3
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:9000/flow-integration; then exit 0; fi
            sleep 2
          done
          docker logs flow-s3
          exit 1

      - name: S3 round trip
        working-directory: api
        env:
          FLOW_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          FLOW_TEST_S3_BUCKET: flow-integration
          FLOW_TEST_S3_ACCESS_KEY: flow
          FLOW_TEST_S3_SECRET_KEY: flow-development-secret
        run: go test -tags=integration ./internal/objectstore -run TestExternalS3RoundTrip

  # coding sessions (track C): the in-sandbox runner and the sandbox image files.
  sandbox-runner:
    name: Sandbox runner
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandbox-runner
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: sandbox-runner/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit and recorded-fixture tests
        run: npm test

      - name: Build bundle
        run: npm run build

      - name: Lint sandbox image
        working-directory: ${{ github.workspace }}
        run: |
          docker run --rm -i hadolint/hadolint:v2.12.0 < deploy/sandbox-image/Dockerfile
          shellcheck deploy/sandbox-image/bin/* deploy/sandbox-image/*.sh

  # coding sessions (track H): Helm chart lint/template golden tests and the
  # egress proxy entrypoint test. Offline only (KUBECONFIG=/dev/null).
  helm-chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.0

      - name: Chart tests
        env:
          KUBECONFIG: /dev/null
        run: sh deploy/helm/flow/tests/run.sh

      - name: Lint egress proxy image
        run: |
          docker run --rm -i hadolint/hadolint:v2.12.0 < deploy/egress-proxy/Dockerfile
          shellcheck deploy/egress-proxy/entrypoint.sh
