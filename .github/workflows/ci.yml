name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request or feature branch cancels its older run. On
  # main (and tags) a running run finishes; GitHub keeps only the newest pending
  # run per group, so the queue stays bounded without starving main of results.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Main pushes keep the complete race, coverage, dialect and release-surface
  # graph. Pull requests use scripts/ci/ci-scope.sh so a web-only change does
  # not wait for Go shards, while workflow and unknown root changes stay broad.
  change-scope:
    name: CI scope
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.scope.outputs.all }}
      api: ${{ steps.scope.outputs.api }}
      web: ${{ steps.scope.outputs.web }}
      sdk: ${{ steps.scope.outputs.sdk }}
      e2e: ${{ steps.scope.outputs.e2e }}
      integration: ${{ steps.scope.outputs.integration }}
      dialect: ${{ steps.scope.outputs.dialect }}
      packaging: ${{ steps.scope.outputs.packaging }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Fetch pull request base
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - name: Determine changed surfaces
        id: scope
        env:
          CI_SCOPE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          CI_SCOPE_HEAD_SHA: ${{ github.sha }}
        run: scripts/ci/ci-scope.sh | tee -a "$GITHUB_OUTPUT"

  # The three vitest coverage gates run the same suite against different coverage
  # scopes and thresholds, so they run side by side instead of one after another.
  # "Web (Node 24 LTS)" below is the required status check that gathers them.
  web-checks:
    name: Web lint and route inventory
    needs: [change-scope]
    if: ${{ needs.change-scope.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Use project npm version
        run: npm install --global npm@10.9.2

      - name: Restore web node_modules
        id: web-modules
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/web/node_modules
          key: web-node-modules-node24-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install dependencies
        if: steps.web-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify API route inventory
        working-directory: ${{ github.workspace }}
        run: node scripts/generate-openapi.mjs --check

  web-tests:
    name: Web unit tests (${{ matrix.name }})
    needs: [change-scope]
    if: ${{ needs.change-scope.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: critical coverage
            script: test:coverage
          - name: workflow coverage gate
            script: test:coverage:workflows
          - name: whole-source coverage baseline
            script: test:coverage:all
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Use project npm version
        run: npm install --global npm@10.9.2

      - name: Restore web node_modules
        id: web-modules
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/web/node_modules
          key: web-node-modules-node24-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install dependencies
        if: steps.web-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Unit tests and coverage
        run: npm run ${{ matrix.script }}

  web:
    name: Web (Node 24 LTS)
    needs: [change-scope, web-checks, web-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every web job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ] && [ "$result" != skipped ]; then
              echo "A web job did not succeed." >&2
              exit 1
            fi
          done

  web-node-26:
    name: Web (Node 26 compatibility)
    needs: [change-scope]
    if: ${{ needs.change-scope.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Use project npm version
        run: npm install --global npm@10.9.2

      - name: Restore web node_modules
        id: web-modules
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/web/node_modules
          key: web-node-modules-node26-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install dependencies
        if: steps.web-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  sdk:
    name: TypeScript SDK
    needs: [change-scope]
    if: ${{ needs.change-scope.outputs.sdk == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Restore SDK node_modules
        id: sdk-modules
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/sdk/typescript/node_modules
          key: sdk-node-modules-node24-${{ runner.os }}-${{ hashFiles('sdk/typescript/package-lock.json') }}

      - name: Install dependencies
        if: steps.sdk-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Verify generated code matches docs/openapi.json
        working-directory: ${{ github.workspace }}
        run: node sdk/typescript/scripts/generate.mjs --check

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e-build:
    name: Browser test build
    needs: [change-scope]
    if: ${{ needs.change-scope.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Use project npm version
        run: npm install --global npm@10.9.2

      - name: Restore web node_modules
        id: web-modules
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/web/node_modules
          key: web-node-modules-node24-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install dependencies
        if: steps.web-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build browser API binaries
        working-directory: api
        run: |
          mkdir -p "$RUNNER_TEMP/browser-build/bin"
          go build -p 1 -o "$RUNNER_TEMP/browser-build/bin/flow-e2e-api" ./cmd/server
          go build -p 1 -tags securitye2e -o "$RUNNER_TEMP/browser-build/bin/flow-security-fixture-api" ./cmd/server

      - name: Build web app
        run: npm run build

      - name: Package shared browser build
        working-directory: ${{ github.workspace }}
        run: |
          cp -R web/dist "$RUNNER_TEMP/browser-build/"
          tar -czf "$RUNNER_TEMP/browser-build.tar.gz" -C "$RUNNER_TEMP/browser-build" bin dist

      - name: Upload shared browser build
        uses: actions/upload-artifact@v7
        with:
          name: browser-build
          path: ${{ runner.temp }}/browser-build.tar.gz
          retention-days: 1

  # 4 browser + 15 API test (api-test max-parallel) + 1 API static job = 20, the
  # hosted-runner limit. The remaining API shards, the web coverage gates and
  # the short jobs take runners as they free up.
  e2e-shard:
    name: Browser E2E (${{ matrix.shard }}/4)
    needs: [change-scope, e2e-build]
    if: ${{ needs.change-scope.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Use project npm version
        run: npm install --global npm@10.9.2

      - name: Restore web node_modules
        id: web-modules
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/web/node_modules
          key: web-node-modules-node24-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install dependencies
        if: steps.web-modules.outputs.cache-hit != 'true'
        working-directory: web
        run: npm ci

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Download shared browser build
        uses: actions/download-artifact@v8
        with:
          name: browser-build
          path: ${{ runner.temp }}/browser-build-download

      - name: Extract shared browser build
        run: |
          mkdir -p "$RUNNER_TEMP/browser-build"
          tar -xzf "$RUNNER_TEMP/browser-build-download/browser-build.tar.gz" -C "$RUNNER_TEMP/browser-build"
          chmod +x "$RUNNER_TEMP/browser-build/bin/"*
          cp -R "$RUNNER_TEMP/browser-build/dist" "$GITHUB_WORKSPACE/web/dist"

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: web
        env:
          # The API's log (the detail behind any 500) goes to this file.
          FLOW_E2E_API_LOG: ${{ runner.temp }}/flow-e2e-api.log
          FLOW_E2E_API_BIN: ${{ runner.temp }}/browser-build/bin/flow-e2e-api
          FLOW_E2E_WEB_MODE: preview
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

      # The response security headers in a real browser, against the production web build
      # the API serves: passkeys, embeds, math, the collaboration socket, CSP reports and
      # the service worker. Reuse the API; build the web app and fixture API once.
      - name: Run security header browser tests
        if: matrix.shard == 1
        working-directory: web
        env:
          FLOW_SECURITY_API_BIN: ${{ runner.temp }}/browser-build/bin/flow-e2e-api
          FLOW_SECURITY_FIXTURE_API_BIN: ${{ runner.temp }}/browser-build/bin/flow-security-fixture-api
          FLOW_SECURITY_WEB_DIST: ${{ runner.temp }}/browser-build/dist
        run: npm run test:e2e:security

      - name: Upload API log and Playwright output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/flow-e2e-api.log
            web/playwright-report
            web/test-results
            web/playwright-report-security
            web/test-results-security
          if-no-files-found: ignore
          retention-days: 7

  e2e-performance:
    name: Browser E2E performance
    needs: [change-scope, e2e-build]
    if: ${{ needs.change-scope.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Use project npm version
        run: npm install --global npm@10.9.2

      - name: Restore web node_modules
        id: web-modules
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/web/node_modules
          key: web-node-modules-node24-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install dependencies
        if: steps.web-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Download shared browser build
        uses: actions/download-artifact@v8
        with:
          name: browser-build
          path: ${{ runner.temp }}/browser-build-download

      - name: Extract shared browser build
        run: |
          mkdir -p "$RUNNER_TEMP/browser-build"
          tar -xzf "$RUNNER_TEMP/browser-build-download/browser-build.tar.gz" -C "$RUNNER_TEMP/browser-build"
          chmod +x "$RUNNER_TEMP/browser-build/bin/"*
          cp -R "$RUNNER_TEMP/browser-build/dist" "$GITHUB_WORKSPACE/web/dist"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run performance tests against shared build
        env:
          FLOW_E2E_API_LOG: ${{ runner.temp }}/flow-e2e-api.log
          FLOW_E2E_API_BIN: ${{ runner.temp }}/browser-build/bin/flow-e2e-api
          FLOW_E2E_DATABASE_PATH: ${{ runner.temp }}/flow-e2e-performance.db
          FLOW_STORAGE_LOCAL_PATH: ${{ runner.temp }}/flow-e2e-performance-uploads
        run: npx playwright test -c playwright.performance.config.ts

      - name: Upload API log and Playwright output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-performance
          path: |
            ${{ runner.temp }}/flow-e2e-api.log
            web/playwright-report-performance
            web/test-results-performance
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Browser E2E
    needs: [change-scope, e2e-build, e2e-shard, e2e-performance]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ] && [ "$result" != skipped ]; then
              echo "A browser job did not succeed." >&2
              exit 1
            fi
          done

  # The API suite is split so no single runner carries it all: cmd/server and
  # internal/store are sharded by measured test time (scripts/ci/go-test-timings.json;
  # see scripts/ci/go-test-shard.sh), and every other package runs in one job. Pushes
  # to main (and manual runs) test with the race detector. Pull requests test
  # without it, in fewer shards
  # (scripts/ci/go-test-shards.json). Tests listed in scripts/ci/known-failing-tests.txt
  # for a mode are left out of its shards and run, never blocking, in "Known failing
  # (tracked)". Each job writes its own coverage profile; api-coverage merges them
  # and enforces the floor. The external-database differential matrix below is
  # still part of push and covered pull-request runs. The SQLite API shards keep
  # the complete test list, including every Scale differential. "API" below is
  # the required status check that gathers every API and dialect job.
  api-plan:
    name: API test plan
    needs: [change-scope]
    if: ${{ needs.change-scope.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      api: ${{ steps.plan.outputs.api }}
      dialect: ${{ steps.plan.outputs.dialect }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci

      - name: Build the test matrices
        id: plan
        env:
          MODE: ${{ github.event_name == 'pull_request' && 'plain' || 'race' }}
        run: scripts/ci/go-test-matrix.sh "$MODE" | tee -a "$GITHUB_OUTPUT"

  # Compile each sharded SQLite package once. The test jobs download these
  # binaries and select their shard with -test.run, so runner startup and Go
  # compilation do not repeat for every shard.
  api-test-build:
    name: Build API test binary (${{ matrix.name }})
    needs: [change-scope, api-plan]
    if: ${{ needs.change-scope.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: api
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            package: ./cmd/server
          - name: store
            package: ./internal/store
    env:
      MODE: ${{ needs.api-plan.outputs.mode }}
      PACKAGE: ${{ matrix.package }}
      BINARY_NAME: flow-${{ needs.api-plan.outputs.mode }}-${{ matrix.name }}.test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Compile test binary
        run: |
          set -euo pipefail
          flags=(-covermode=atomic)
          if [ "$MODE" = race ]; then
            flags=(-race -covermode=atomic)
          fi
          go test -c "${flags[@]}" -o "$RUNNER_TEMP/$BINARY_NAME" "$PACKAGE"
          chmod +x "$RUNNER_TEMP/$BINARY_NAME"
          if [ "$MODE" = race ]; then
            go test -c -race -o "$RUNNER_TEMP/flow-race-${{ matrix.name }}-nocover.test" "$PACKAGE"
            chmod +x "$RUNNER_TEMP/flow-race-${{ matrix.name }}-nocover.test"
          fi

      - name: Upload test binary
        uses: actions/upload-artifact@v7
        with:
          name: go-test-bin-${{ needs.api-plan.outputs.mode }}-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ env.BINARY_NAME }}
          retention-days: 3

      - name: Upload race-only differential binary
        if: ${{ needs.api-plan.outputs.mode == 'race' }}
        uses: actions/upload-artifact@v7
        with:
          name: go-test-bin-race-nocover-${{ matrix.name }}
          path: ${{ runner.temp }}/flow-race-${{ matrix.name }}-nocover.test
          retention-days: 3

  # The PostgreSQL and MySQL differential shards use one plain test binary per
  # package. The database driver is selected at runtime, so the same artifact
  # serves both matrices.
  scale-test-build:
    name: Build Scale test binary (${{ matrix.name }})
    needs: [change-scope]
    if: ${{ needs.change-scope.outputs.dialect == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: api
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            package: ./cmd/server
          - name: store
            package: ./internal/store
    env:
      PACKAGE: ${{ matrix.package }}
      BINARY_NAME: flow-scale-${{ matrix.name }}.test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Compile test binary
        run: |
          set -euo pipefail
          go test -c -o "$RUNNER_TEMP/$BINARY_NAME" "$PACKAGE"
          chmod +x "$RUNNER_TEMP/$BINARY_NAME"

      - name: Upload test binary
        uses: actions/upload-artifact@v7
        with:
          name: go-scale-test-bin-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ env.BINARY_NAME }}
          retention-days: 3

  api-static:
    name: API vet and shard check
    needs: [change-scope]
    if: ${{ needs.change-scope.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api
    env:
      # The test list does not depend on instrumentation; vet already compiled
      # the plain packages.
      GO_TEST_LIST_FLAGS: -covermode=atomic
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Vet
        run: go vet ./...

      # Fails unless, in every mode, the shards of each sharded package partition
      # its tests minus that mode's known failures: every test lands in exactly one
      # shard, and each shard's -run pattern selects exactly that shard's tests.
      # Also fails when the known-failing list is malformed or names a test that no
      # longer exists. The counts come from scripts/ci/go-test-shards.json, like the
      # api-test and scale-dialects matrices.
      - name: Check test shards cover every test once
        env:
          CHECK_PATTERNS: '1'
        run: |
          set -euo pipefail
          shards=../scripts/ci/go-test-shards.json
          ../scripts/ci/go-test-shard.sh baseline
          for package in ./cmd/server ./internal/store; do
            for mode in race plain; do
              total=$(jq -r --arg mode "$mode" --arg package "$package" '.[$mode][$package]' "$shards")
              echo "::group::$package, $mode, $total shards"
              SHARD_SCOPE=$mode ../scripts/ci/go-test-shard.sh check "$package" "$total"
              SHARD_SCOPE=$mode ../scripts/ci/go-test-shard.sh plan "$package" "$total"
              echo "::endgroup::"
            done
            for dialect in postgres mysql; do
              total=$(jq -r --arg package "$package" '.dialect[$package]' "$shards")
              echo "::group::$package scale tests, $dialect, $total shards"
              GO_TEST_SHARD_SELECTION=dialect GO_TEST_TIMINGS=../scripts/ci/go-test-timings-dialect.json SHARD_SCOPE=$dialect ../scripts/ci/go-test-shard.sh check "$package" "$total"
              GO_TEST_SHARD_SELECTION=dialect GO_TEST_TIMINGS=../scripts/ci/go-test-timings-dialect.json SHARD_SCOPE=$dialect ../scripts/ci/go-test-shard.sh plan "$package" "$total"
              echo "::endgroup::"
            done
          done

  api-test:
    name: API tests (${{ matrix.name }})
    needs: [change-scope, api-plan, api-test-build]
    if: ${{ needs.change-scope.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    # The precompiled test binary's timeout fires before the job timeout.
    timeout-minutes: 65
    defaults:
      run:
        working-directory: api
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.api-plan.outputs.api) }}
    env:
      MODE: ${{ needs.api-plan.outputs.mode }}
      # Use the test run's instrumentation when listing tests so shard
      # validation and the uploaded binary agree on the test set.
      GO_TEST_LIST_FLAGS: ${{ needs.api-plan.outputs.mode == 'race' && '-race -covermode=atomic' || '-covermode=atomic' }}
      SHARD_SCOPE: ${{ needs.api-plan.outputs.mode }}
      PACKAGE: ${{ matrix.package }}
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ matrix.shards }}
      PROFILE: ${{ matrix.profile }}
      BUILD_CACHE_GROUP: ${{ matrix.package == './cmd/server' && 'server' || matrix.package == './internal/store' && 'store' || 'other' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Download precompiled test binary
        if: ${{ matrix.package != 'others' }}
        uses: actions/download-artifact@v8
        with:
          name: go-test-bin-${{ needs.api-plan.outputs.mode }}-${{ matrix.package == './cmd/server' && 'server' || 'store' }}
          path: ${{ runner.temp }}/go-test-bin

      - name: Download race-only differential binary
        if: ${{ matrix.package != 'others' && needs.api-plan.outputs.mode == 'race' }}
        uses: actions/download-artifact@v8
        with:
          name: go-test-bin-race-nocover-${{ matrix.package == './cmd/server' && 'server' || 'store' }}
          path: ${{ runner.temp }}/go-test-bin

      - name: Make test binaries executable
        if: ${{ matrix.package != 'others' }}
        run: chmod +x "$RUNNER_TEMP/go-test-bin/"*.test

      # Every SQLite test remains in the shard assignment. On main, the
      # differential subset runs from the race-only binary, while the rest of
      # the same shard runs from the race-plus-atomic binary. This keeps the
      # SQLite differential race signal and collects package coverage from the
      # ordinary API tests without paying atomic instrumentation on the
      # differential loops.
      - name: Run sharded SQLite tests
        if: ${{ matrix.package != 'others' }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/coverage" "$GITHUB_WORKSPACE/timings"
          all_names="$RUNNER_TEMP/all-names"
          dialect_names="$RUNNER_TEMP/dialect-names"
          dialect_shard_names="$RUNNER_TEMP/dialect-shard-names"
          core_names="$RUNNER_TEMP/core-names"
          export GO_TEST_BINARY="$RUNNER_TEMP/go-test-bin/flow-$MODE-$BUILD_CACHE_GROUP.test"
          ../scripts/ci/go-test-shard.sh list "$PACKAGE" "$SHARD" "$SHARDS" > "$all_names"
          if [ "$MODE" = race ]; then
            GO_TEST_SHARD_SELECTION=dialect SHARD_SCOPE="$SHARD_SCOPE" \
              ../scripts/ci/go-test-shard.sh list "$PACKAGE" 1 1 > "$dialect_names"
            LC_ALL=C comm -12 <(LC_ALL=C sort "$all_names") <(LC_ALL=C sort "$dialect_names") > "$dialect_shard_names"
            LC_ALL=C comm -23 <(LC_ALL=C sort "$all_names") <(LC_ALL=C sort "$dialect_names") > "$core_names"
          else
            : > "$dialect_shard_names"
            cp "$all_names" "$core_names"
          fi
          pattern_for() {
            printf '^(%s)$' "$(paste -sd'|' "$1")"
          }
          events="$GITHUB_WORKSPACE/timings/$PROFILE.jsonl"
          : > "$events"
          status=0
          if [ -s "$core_names" ]; then
            ../scripts/ci/go-test-binary.sh \
              "$RUNNER_TEMP/go-test-bin/flow-$MODE-$BUILD_CACHE_GROUP.test" \
              "$PACKAGE" \
              "$(pattern_for "$core_names")" \
              "$events" \
              "$GITHUB_WORKSPACE/coverage/$PROFILE.out" \
              50m \
              "$(go list -m)" || status=$?
          else
            echo 'mode: atomic' > "$GITHUB_WORKSPACE/coverage/$PROFILE.out"
          fi
          if [ -s "$dialect_shard_names" ]; then
            dialect_status=0
            GO_TEST_EVENTS_APPEND=1 ../scripts/ci/go-test-binary.sh \
              "$RUNNER_TEMP/go-test-bin/flow-race-$BUILD_CACHE_GROUP-nocover.test" \
              "$PACKAGE" \
              "$(pattern_for "$dialect_shard_names")" \
              "$events" \
              "" \
              50m \
              "$(go list -m)" || dialect_status=$?
            if [ "$status" -eq 0 ] && [ "$dialect_status" -ne 0 ]; then
              status=$dialect_status
            fi
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Test other API packages with coverage
        if: ${{ matrix.package == 'others' }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/coverage" "$GITHUB_WORKSPACE/timings"
          mapfile -t packages < <(go list ./... | grep -vE '/cmd/server$|/internal/store$')
          race_flag=
          if [ "$MODE" = race ]; then race_flag=-race; fi
          events="$GITHUB_WORKSPACE/timings/$PROFILE.jsonl"
          status=0
          go test -json ${race_flag:+$race_flag} -count=1 -timeout 50m -covermode=atomic \
            -coverprofile="$GITHUB_WORKSPACE/coverage/$PROFILE.out" \
            "${packages[@]}" 2>&1 |
            tee "$events" | ../scripts/ci/go-test-json.sh log || status=$?
          if [ "$status" -ne 0 ]; then
            ../scripts/ci/go-test-json.sh failures "$events" || true
            exit "$status"
          fi

      - name: Convert test events to timings
        run: |
          if [ "$PACKAGE" = others ]; then
            echo '{}' > "$GITHUB_WORKSPACE/timings/$PROFILE.json"
          else
            ../scripts/ci/go-test-json.sh timings "$(go list -m)" \
              "$GITHUB_WORKSPACE/timings/$PROFILE.json" "$GITHUB_WORKSPACE/timings/$PROFILE.jsonl" || echo '{}' > "$GITHUB_WORKSPACE/timings/$PROFILE.json"
          fi

      - name: Upload per-package and per-test events
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: go-test-events-${{ matrix.profile }}
          path: timings/${{ matrix.profile }}.jsonl
          if-no-files-found: warn
          retention-days: 3

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage-${{ matrix.profile }}
          path: coverage/${{ matrix.profile }}.out
          if-no-files-found: error
          retention-days: 3

      # Per-test durations (name to seconds) of this shard, merged by api-timings.
      - name: Upload test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: go-test-timings-${{ matrix.profile }}
          path: timings/${{ matrix.profile }}.json
          if-no-files-found: error
          retention-days: 3

  api-coverage:
    name: API coverage
    needs: [change-scope, api-test]
    if: ${{ needs.change-scope.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Download coverage profiles
        uses: actions/download-artifact@v8
        with:
          pattern: go-coverage-*
          path: ${{ github.workspace }}/coverage
          merge-multiple: true

      - name: Merge coverage profiles
        run: ../scripts/ci/merge-go-coverage.sh coverage.out "$GITHUB_WORKSPACE"/coverage/*.out

      - name: Enforce coverage floor
        run: |
          set -euo pipefail
          ../scripts/check-go-coverage.sh coverage.out | tee coverage-summary.txt
          {
            echo '### Go coverage'
            echo '```'
            cat coverage-summary.txt
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Merge the shards' per-test durations (of the tests that passed) into one
  # file. The shard assignment reads scripts/ci/go-test-timings.json;
  # scripts/ci/update-go-test-timings.sh downloads this artifact from completed
  # main runs for the scheduled refresh PR, or from the run IDs it is given (a
  # red run measures what it ran). The file holds race-detector times: refresh it
  # from main or manual runs, not from pull requests (those run without the race
  # detector). Not part of the "API" gate: a missing timings file must never fail a build.
  api-timings:
    name: API test timings
    needs: [change-scope, api-test]
    if: ${{ !cancelled() && needs.change-scope.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download shard timings
        uses: actions/download-artifact@v8
        with:
          pattern: go-test-timings-*
          path: ${{ github.workspace }}/timings
          merge-multiple: true

      - name: Merge timings
        run: ./scripts/ci/go-test-json.sh merge go-test-timings.json "$GITHUB_WORKSPACE"/timings/*.json

      - name: Upload merged timings
        uses: actions/upload-artifact@v7
        with:
          name: go-test-timings
          path: go-test-timings.json
          if-no-files-found: error
          retention-days: 30

  api:
    name: API
    needs: [change-scope, api-plan, api-static, api-test-build, api-test, api-coverage, scale-test-build, scale-dialects]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every API job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ] && [ "$result" != skipped ]; then
              echo "An API job did not succeed." >&2
              exit 1
            fi
          done

  infrastructure:
    name: Infrastructure integration
    needs: [change-scope]
    if: ${{ needs.change-scope.outputs.integration == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flow
          POSTGRES_PASSWORD: flow
          POSTGRES_DB: flow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flow -d flow"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: flow
          MYSQL_PASSWORD: flow
          MYSQL_DATABASE: flow
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:8.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Permit triggers in the isolated MySQL service
        run: >-
          docker exec -e MYSQL_PWD=root ${{ job.services.mysql.id }} mysql -uroot -e
          "SET GLOBAL log_bin_trust_function_creators=1;"

      - name: PostgreSQL metadata upgrade checks
        working-directory: api
        env:
          FLOW_TEST_DATABASE_DRIVER: postgres
          FLOW_TEST_DATABASE_URL: postgres://flow:flow@127.0.0.1:5432/flow?sslmode=disable
        run: |
          go test -tags integration ./cmd/server -run '^TestDefaultMetadataUpgrade$' -count=1 -timeout 15m
          go test -tags integration ./internal/store -run '^TestDefaultMetadataUpgradeResumesLegacyWrites$' -count=1 -timeout 15m

      - name: MySQL metadata upgrade checks
        working-directory: api
        env:
          FLOW_TEST_DATABASE_DRIVER: mysql
          FLOW_TEST_DATABASE_URL: mysql://flow:flow@127.0.0.1:3306/flow
        run: |
          go test -tags integration ./cmd/server -run '^TestDefaultMetadataUpgrade$' -count=1 -timeout 15m
          go test -tags integration ./internal/store -run '^TestDefaultMetadataUpgradeResumesLegacyWrites$' -count=1 -timeout 15m

      - name: Checkout main for the MySQL write baseline
        uses: actions/checkout@v7
        with:
          ref: main
          path: mysql-import-write-baseline

      - name: Create isolated binlog regression databases
        run: >-
          docker exec -e MYSQL_PWD=root ${{ job.services.mysql.id }} mysql -uroot -e
          "CREATE DATABASE flow_write_audit; CREATE DATABASE flow_write_prior;
          GRANT ALL ON flow_write_audit.* TO 'flow'@'%'; GRANT ALL ON flow_write_prior.* TO 'flow'@'%';
          GRANT REPLICATION CLIENT ON *.* TO 'flow'@'%';"

      - name: Measure main MySQL import writes
        working-directory: mysql-import-write-baseline/api
        env:
          FLOW_BOUNDED_METADATA: 'off'
          FLOW_RECORD_HYDRATION: 'off'
          FLOW_RECORD_JOURNAL: 'off'
          FLOW_TEST_WRITE_MYSQL_DSN: flow:flow@tcp(127.0.0.1:3306)/flow_write_prior?parseTime=true
        run: |
          git rev-parse HEAD
          go test ./cmd/server -run '^TestMySQLImportWriteAmplification$' -count=1 -v 2>&1 | tee /tmp/mysql-import-main-binlog.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Verify bounded MySQL import writes
        working-directory: api
        env:
          FLOW_BOUNDED_METADATA: 'off'
          FLOW_RECORD_HYDRATION: 'off'
          FLOW_RECORD_JOURNAL: 'off'
          FLOW_TEST_WRITE_MYSQL_DSN: flow:flow@tcp(127.0.0.1:3306)/flow_write_audit?parseTime=true
          FLOW_ASSERT_WRITE_BOUNDS: '1'
        run: |
          go test ./cmd/server -run '^TestMySQLImportWriteAmplification$' -count=1 -v 2>&1 | tee /tmp/mysql-import-branch-binlog.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Compare MySQL writes with main
        run: |
          baseline_bytes=$(awk -F'bytes=' '/BINLOG phase=csv_commit_2000 / { split($2, value, " "); print value[1] }' /tmp/mysql-import-main-binlog.log)
          branch_bytes=$(awk -F'bytes=' '/BINLOG phase=csv_commit_2000 / { split($2, value, " "); print value[1] }' /tmp/mysql-import-branch-binlog.log)
          [[ "$baseline_bytes" =~ ^[0-9]+$ && "$branch_bytes" =~ ^[0-9]+$ ]]
          printf 'binlog baseline_bytes=%s branch_bytes=%s allowance_bytes=65536\n' "$baseline_bytes" "$branch_bytes"
          test "$baseline_bytes" -gt 0
          test "$branch_bytes" -le "$((baseline_bytes + 65536))"

      - name: PostgreSQL round trip
        working-directory: api
        env:
          FLOW_TEST_DATABASE_DRIVER: postgres
          FLOW_TEST_DATABASE_URL: postgres://flow:flow@127.0.0.1:5432/flow?sslmode=disable
        run: go test -tags=integration ./internal/store -run 'TestExternalDatabase(WorkspaceRoundTrip|ApplicationSchema|WorkspacePurge|WorkspaceRename)' -count=1

      - name: MySQL round trip
        working-directory: api
        env:
          FLOW_TEST_DATABASE_DRIVER: mysql
          FLOW_TEST_DATABASE_URL: mysql://flow:flow@127.0.0.1:3306/flow
        run: go test -tags=integration ./internal/store -run 'TestExternalDatabase(WorkspaceRoundTrip|ApplicationSchema|WorkspacePurge|WorkspaceRename)' -count=1

      - name: Redis coordination round trip
        working-directory: api
        env:
          FLOW_TEST_REDIS_ADDR: 127.0.0.1:6379
        run: go test -tags=integration ./internal/coordination -run TestExternalRedisCoordinationRoundTrip

      - name: Start S3 server
        # MinIO no longer publishes pullable images (quay.io and Docker Hub answer
        # 401). The round trip only needs HeadBucket and object put/get/delete, which
        # S3Mock serves; it creates the bucket at startup and accepts any credentials.
        run: |
          docker run -d --name flow-s3 -p 9000:9090 \
            -e COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=flow-integration \
            adobe/s3mock:5.2.3
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:9000/flow-integration; then exit 0; fi
            sleep 2
          done
          docker logs flow-s3
          exit 1

      - name: S3 round trip
        working-directory: api
        env:
          FLOW_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          FLOW_TEST_S3_BUCKET: flow-integration
          FLOW_TEST_S3_ACCESS_KEY: flow
          FLOW_TEST_S3_SECRET_KEY: flow-development-secret
        run: go test -tags=integration ./internal/objectstore -run TestExternalS3RoundTrip

  # Run the scale differential suite on every main push and on pull requests
  # that can change Go behavior. Web-only, docs-only, Helm-only and SDK-only
  # pull requests skip this matrix through scripts/ci/ci-scope.sh. The suite
  # remains plain because its value is the PostgreSQL/MySQL behavior comparison.
  # It keeps the restricted-MySQL trigger and journal-capture probes. The
  # metadata-upgrade checks run once per backend in infrastructure, where those
  # same backend checks already have service databases. Each shard reuses one
  # precompiled package test binary.
  scale-dialects:
    name: Scale differentials (${{ matrix.name }})
    needs: [change-scope, api-plan, scale-test-build]
    if: ${{ needs.change-scope.outputs.dialect == 'true' && needs.api-plan.result == 'success' && needs.scale-test-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.api-plan.outputs.dialect) }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flow
          POSTGRES_PASSWORD: flow
          POSTGRES_DB: flow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flow -d flow"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: flow
          MYSQL_PASSWORD: flow
          MYSQL_DATABASE: flow
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      GO_TEST_SHARD_SELECTION: dialect
      GO_TEST_TIMINGS: ../scripts/ci/go-test-timings-dialect.json
      SHARD_SCOPE: ${{ matrix.dialect }}
      FLOW_TEST_DATABASE_DRIVER: ${{ matrix.dialect }}
      FLOW_TEST_DATABASE_URL: ${{ matrix.dialect == 'postgres' && 'postgres://flow:flow@127.0.0.1:5432/flow?sslmode=disable' || 'mysql://flow:flow@127.0.0.1:3306/flow' }}
      PACKAGE: ${{ matrix.package }}
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ matrix.shards }}
      BINARY_NAME: flow-scale-${{ matrix.package == './cmd/server' && 'server' || 'store' }}.test
      GO_TEST_BINARY: ${{ runner.temp }}/go-scale-test-bin/flow-scale-${{ matrix.package == './cmd/server' && 'server' || 'store' }}.test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Download precompiled test binary
        uses: actions/download-artifact@v8
        with:
          name: go-scale-test-bin-${{ matrix.package == './cmd/server' && 'server' || 'store' }}
          path: ${{ runner.temp }}/go-scale-test-bin

      - name: Make test binary executable
        run: chmod +x "$RUNNER_TEMP/go-scale-test-bin/"*.test

      - name: Upgrade with restricted MySQL trigger permissions
        if: matrix.dialect == 'mysql' && matrix.package == './cmd/server' && matrix.shard == 1
        working-directory: api
        env:
          FLOW_TEST_MYSQL_ADMIN_URL: mysql://root:root@127.0.0.1:3306/flow
        run: go test -tags integration ./cmd/server -run '^TestDefaultMetadataUpgradeWithRestrictedMySQL$' -count=1 -timeout 15m

      - name: Application journal capture without MySQL trigger authority
        if: matrix.dialect == 'mysql' && matrix.package == './internal/store' && matrix.shard == 1
        working-directory: api
        env:
          FLOW_TEST_MYSQL_ADMIN_URL: mysql://root:root@127.0.0.1:3306/flow
          FLOW_TEST_DATABASE_DRIVER: mysql
          FLOW_TEST_DATABASE_URL: mysql://flow:flow@127.0.0.1:3306/flow_capture
        run: |
          docker exec -e MYSQL_PWD=root ${{ job.services.mysql.id }} mysql -uroot -e \
            "CREATE DATABASE flow_capture; GRANT ALL ON flow_capture.* TO 'flow'@'%';"
          pattern=$(../scripts/ci/go-test-shard.sh selection mysql-capture ./internal/store)
          (
            cd ./internal/store
            timeout --foreground 20m "$RUNNER_TEMP/go-scale-test-bin/$BINARY_NAME" \
              -test.run "$pattern" \
              -test.count=1 \
              -test.timeout=20m \
              -test.v
          )

      - name: Permit triggers in the isolated MySQL service
        if: matrix.dialect == 'mysql'
        run: >-
          docker exec -e MYSQL_PWD=root ${{ job.services.mysql.id }} mysql -uroot -e
          "SET GLOBAL log_bin_trust_function_creators=1;"

      - name: Permit scratch databases in the isolated MySQL service
        if: matrix.dialect == 'mysql'
        run: >-
          docker exec -e MYSQL_PWD=root ${{ job.services.mysql.id }} mysql -uroot -e
          "GRANT ALL ON \`flow\\_sw602\\_%\`.* TO 'flow'@'%';
          GRANT ALL ON \`flow\\_prepare\\_%\`.* TO 'flow'@'%';"

      - name: Run scale differentials
        working-directory: api
        # A shard is bounded below the job timeout. The resume helper starts
        # tests that were not reached after a timeout, so one hang cannot hide
        # the rest of the selected suite.
        run: |
          set -euo pipefail
          ../scripts/ci/go-test-shard.sh list "$PACKAGE" "$SHARD" "$SHARDS" > "$RUNNER_TEMP/names"
          echo "Shard $SHARD/$SHARDS of the scale tests of $PACKAGE: $(wc -l < "$RUNNER_TEMP/names") tests"
          GO_TEST_BINARY="$RUNNER_TEMP/go-scale-test-bin/$BINARY_NAME" \
            ../scripts/ci/go-test-resume.sh "$PACKAGE" "$RUNNER_TEMP/names" 60m

  # The tests of scripts/ci/known-failing-tests.txt, each in every scope it is listed
  # for: race and plain on SQLite (with and without the race detector), postgres and
  # mysql on those databases. Each test runs alone with a 10-minute timeout, so a hang
  # ends. This job never fails: its summary lists which tests still fail and which
  # pass now, and every passing test gets a warning so its line is removed. It starts
  # after the blocking test jobs so it never holds a runner they wait for.
  known-failing:
    name: Known failing (tracked, ${{ matrix.scope }})
    needs: [change-scope, api-plan, api-test, scale-dialects]
    if: ${{ always() && needs.change-scope.outputs.api == 'true' && needs.api-plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        scope: [race, plain, postgres, mysql]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flow
          POSTGRES_PASSWORD: flow
          POSTGRES_DB: flow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flow -d flow"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: flow
          MYSQL_PASSWORD: flow
          MYSQL_DATABASE: flow
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Permit triggers in the isolated MySQL service
        if: matrix.scope == 'mysql'
        continue-on-error: true
        run: >-
          docker exec -e MYSQL_PWD=root ${{ job.services.mysql.id }} mysql -uroot -e
          "SET GLOBAL log_bin_trust_function_creators=1;"

      - name: Run the known-failing tests
        working-directory: api
        continue-on-error: true
        env:
          SCOPE: ${{ matrix.scope }}
        run: ../scripts/ci/run-known-failing.sh "$SCOPE"

  # coding sessions (track C): the in-sandbox runner and the sandbox image files.
  sandbox-runner:
    name: Sandbox runner
    needs: [change-scope]
    if: ${{ needs.change-scope.outputs.packaging == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandbox-runner
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: sandbox-runner/package-lock.json

      - name: Restore sandbox node_modules
        id: sandbox-modules
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/sandbox-runner/node_modules
          key: sandbox-node-modules-node22-${{ runner.os }}-${{ hashFiles('sandbox-runner/package-lock.json') }}

      - name: Install dependencies
        if: steps.sandbox-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit and recorded-fixture tests
        run: npm test

      - name: Build bundle
        run: npm run build

      - name: Lint sandbox image
        working-directory: ${{ github.workspace }}
        run: |
          docker run --rm -i hadolint/hadolint:v2.12.0 < deploy/sandbox-image/Dockerfile
          shellcheck deploy/sandbox-image/bin/* deploy/sandbox-image/*.sh

  # coding sessions (track H): Helm chart lint/template golden tests and the
  # egress proxy entrypoint test. Offline only (KUBECONFIG=/dev/null).
  helm-chart:
    name: Helm chart
    needs: [change-scope]
    if: ${{ needs.change-scope.outputs.packaging == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.0

      - name: Chart tests
        env:
          KUBECONFIG: /dev/null
        run: sh deploy/helm/flow/tests/run.sh

      - name: Lint egress proxy image
        run: |
          docker run --rm -i hadolint/hadolint:v2.12.0 < deploy/egress-proxy/Dockerfile
          shellcheck deploy/egress-proxy/entrypoint.sh
