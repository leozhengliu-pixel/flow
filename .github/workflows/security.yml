name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Pull request and feature branch runs are superseded by the next push; a run
  # on main finishes, and only the newest pending run per group is kept.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dependency-and-secret-scan:
    name: Dependencies and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      # govulncheck has no ignore option, so this step fails exactly as its
      # text mode does (any vulnerable function the code reaches) except for
      # REVIEWED: advisories with no fixed release that Flow mitigates in code,
      # each until its review date, the same entries as api/osv-scanner.toml.
      # GO-2026-6909 (github.com/crewjam/saml): mitigated in
      # api/cmd/server/saml_assertion_guard.go.
      - name: Go vulnerability scan
        working-directory: api
        env:
          REVIEWED: GO-2026-6909:2027-02-05
        run: |
          report="$RUNNER_TEMP/govulncheck.json"
          go run golang.org/x/vuln/cmd/govulncheck@latest -format json ./... > "$report"
          reachable=$(jq -r 'select(.finding != null and (.finding.trace[0].function // "") != "") | .finding.osv' "$report" | sort -u)
          today=$(date -u +%F)
          unreviewed=""
          for id in $reachable; do
            until=""
            for entry in $REVIEWED; do
              if [ "${entry%%:*}" = "$id" ]; then until="${entry#*:}"; fi
            done
            if [ -n "$until" ] && [[ ! "$today" > "$until" ]]; then
              echo "::warning::$id is reachable; reviewed and mitigated until $until (see api/osv-scanner.toml)"
            else
              unreviewed="$unreviewed $id"
            fi
          done
          if [ -n "$unreviewed" ]; then
            echo "::error::Reachable vulnerabilities without a current review:$unreviewed"
            go run golang.org/x/vuln/cmd/govulncheck@latest ./... || true
            exit 1
          fi

      - name: Web dependency audit
        working-directory: web
        run: npm audit --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL (${{ matrix.language }})
    env:
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4

  osv-scan:
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0
    with:
      scan-args: |-
        --include-git-root
        --recursive
        ./

  osv-scan-pr:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.6.0
    with:
      scan-args: |-
        --include-git-root
        --recursive
        ./
