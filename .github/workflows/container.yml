name: Container

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Release tag builds and builds on main are never cancelled (only the newest
  # pending run per group is kept); pull request and feature branch builds are
  # superseded by the next push.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Use project npm version
        run: npm install --global npm@10.9.2

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Validate web application
        working-directory: web
        run: npm run lint

      - name: Build web assets
        working-directory: web
        run: npm run build

      - name: Test API
        working-directory: api
        run: go test ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Read application version
        id: app-version
        run: |
          version=$(node --print "require('./web/package.json').version")
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      # The image carries the previous release's hashed web assets (Dockerfile
      # PREVIOUS_RELEASE_IMAGE), so pages of that release keep loading from new
      # replicas during a rolling update: the previous version tag for a tag
      # build, the last published main image otherwise.
      - name: Find previous release image
        id: previous
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          candidate="${IMAGE}:latest"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            previous=$(git ls-remote --tags --refs origin 'v*.*.*' | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | awk -v current="${GITHUB_REF_NAME}" '$0 == current { print last; exit } { last = $0 }')
            candidate=${previous:+${IMAGE}:${previous}}
          fi
          if [ -n "${candidate}" ] && docker buildx imagetools inspect "${candidate}" >/dev/null 2>&1; then
            printf 'image=%s\n' "${candidate}" >> "$GITHUB_OUTPUT"
          else
            printf 'image=no-previous-release\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le,linux/s390x
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.app-version.outputs.version }}
            VCS_REF=${{ github.sha }}
            PREVIOUS_RELEASE_IMAGE=${{ steps.previous.outputs.image || 'no-previous-release' }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=container
          cache-to: type=gha,mode=max,scope=container

      - name: Verify public package
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          docker logout "${REGISTRY}" >/dev/null 2>&1 || true
          docker buildx imagetools inspect "${IMAGE}:latest"

  # coding sessions (track C): the sandbox image (FLOW_CODING_IMAGE).
  sandbox-image:
    name: Build and publish sandbox image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-sandbox
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build sandbox image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/sandbox-image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=sandbox-image
          cache-to: type=gha,mode=max,scope=sandbox-image

  # coding sessions (track H): the Squid egress proxy image (egressProxy.image).
  egress-image:
    name: Build and publish egress proxy image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-egress
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build egress proxy image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/egress-proxy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=egress-image
          cache-to: type=gha,mode=max,scope=egress-image
