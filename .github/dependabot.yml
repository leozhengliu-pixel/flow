version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - web
    commit-message:
      prefix: chore(web)
    groups:
      tiptap:
        patterns:
          - "@tiptap/*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - api
    commit-message:
      prefix: chore(api)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns:
          - "*"
