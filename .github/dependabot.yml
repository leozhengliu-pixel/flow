version: 2
# Paused 2026-11-17 (owner): every Dependabot pull request runs the full CI and competes with merge trains for the
# 20 concurrent runner jobs. open-pull-requests-limit 0 stops new version-update PRs and rebase-strategy disabled stops
# rebasing the open ones. Restore the previous limits (web/api 5, actions/docker 3) and remove the rebase lines to resume.
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    labels:
      - dependencies
      - web
    commit-message:
      prefix: chore(web)
    groups:
      tiptap:
        patterns:
          - "@tiptap/*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    labels:
      - dependencies
      - api
    commit-message:
      prefix: chore(api)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    labels:
      - dependencies
      - container
    commit-message:
      prefix: chore(container)
